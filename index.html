  <title>我的个人成长工作台</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="apple-touch-startup-image" media="(device-width: 1242px) and (device-height: 2688px) and (-webkit-device-pixel-ratio: 3)" href="splash-1242x2688.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 1170px) and (device-height: 2532px) and (-webkit-device-pixel-ratio: 3)" href="splash-1170x2532.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 1290px) and (device-height: 2796px) and (-webkit-device-pixel-ratio: 3)" href="splash-1290x2796.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 750px) and (device-height: 1334px) and (-webkit-device-pixel-ratio: 2)" href="splash-750x1334.png" />
  <link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" href="splash-834x1194.png" />

  <style>
    /* === 版本更新提示（新增，不影响业务） === */
    .update-toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(var(--safe-bottom) + 84px); z-index: 60;
      width: calc(100% - 32px); max-width: 448px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 18px; box-shadow: var(--shadow);
      padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px;
      animation: utIn .28s cubic-bezier(.34,1.4,.64,1);
    }
    @keyframes utIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .update-toast .ut-ico { font-size: 22px; line-height: 1; }
    .update-toast .ut-body { flex: 1; min-width: 0; }
    .update-toast .ut-title { font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
    .update-toast .ut-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .update-toast .ut-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  </style>
  <style>
/* =========================================================
   我的个人成长工作台 · 设计系统
   简洁 / 现代 / 有成长感 / 移动端优先
   ========================================================= */

:root {
  /* 背景与表面 */
  --bg: #f4f3ef;
  --surface: #ffffff;
  --surface-2: #fafaf8;
  --surface-soft: #f0efe9;

  /* 文本 */
  --text: #1c1c1e;
  --text-2: #6b6b70;
  --text-3: #9a9aa0;

  /* 描边 */
  --line: #e8e6e0;
  --line-soft: #f0eee9;

  /* 主强调色（沉静的蓝紫，克制的成长感） */
  --accent: #5b6cf0;
  --accent-soft: #eef0fe;
  --accent-ink: #3b49c4;

  /* 语义色 */
  --up: #1aa179;        /* 增长 */
  --up-soft: #e6f5ef;
  --down: #e5484d;      /* 下降 */
  --down-soft: #fdecec;
  --gold: #c9962b;
  --gold-soft: #fbf2dd;
  --warn: #d98a1f;
  --warn-soft: #fbf0de;

  /* 类别色 */
  --c-ai: #6c5ce7;
  --c-en: #2b8a9b;
  --c-build: #e1679b;
  --c-wealth: #c9962b;
  --c-body: #2f9e6e;
  --c-content: #e07a3f;

  --radius: 18px;
  --radius-sm: 12px;
  --radius-lg: 26px;
  --shadow: 0 1px 2px rgba(20,20,40,.04), 0 8px 24px -12px rgba(20,20,40,.12);
  --shadow-soft: 0 1px 2px rgba(20,20,40,.03), 0 4px 14px -10px rgba(20,20,40,.10);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --header-h: 64px;
  --tab-h: 62px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}

[data-theme="dark"] {
  --bg: #16161a;
  --surface: #1f1f25;
  --surface-2: #232329;
  --surface-soft: #2a2a31;
  --text: #f3f3f5;
  --text-2: #a3a3ab;
  --text-3: #6e6e76;
  --line: #2e2e36;
  --line-soft: #28282f;
  --accent: #7c8bff;
  --accent-soft: #23264a;
  --accent-ink: #aab4ff;
  --up: #36c596;
  --up-soft: #14352b;
  --down: #ff6b70;
  --down-soft: #3a1f22;
  --gold: #e0b35a;
  --gold-soft: #342b18;
  --warn: #e8a94a;
  --warn-soft: #332816;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-soft: 0 1px 2px rgba(0,0,0,.25), 0 4px 16px -10px rgba(0,0,0,.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: 15px; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ===== 布局骨架 ===== */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 60px -30px rgba(0,0,0,.25);
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  padding-top: var(--safe-top);
  border-bottom: 1px solid var(--line-soft);
}
.header-inner {
  height: var(--header-h);
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-eyebrow { font-size: 12.5px; color: var(--text-2); letter-spacing: .2px; }
.header-title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-top: 1px; }
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center; font-size: 17px;
  background: var(--surface-soft); color: var(--text);
  transition: transform .12s ease, background .12s ease;
}
.icon-btn:active { transform: scale(.92); }

.app-main {
  padding: 16px 16px calc(var(--tab-h) + var(--safe-bottom) + 24px);
  min-height: calc(100vh - var(--header-h) - var(--tab-h));
}

/* ===== 底部导航 ===== */
.tab-bar {
  position: fixed;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  height: calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
  display: flex;
  z-index: 40;
}
.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--text-3);
  transition: color .15s ease;
  position: relative;
}
.tab-ico { font-size: 21px; line-height: 1; transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
.tab-label { font-size: 10.5px; font-weight: 600; letter-spacing: .2px; }
.tab.active { color: var(--accent-ink); }
.tab.active .tab-ico { transform: translateY(-1px) scale(1.08); }
.tab.active::before {
  content: ""; position: absolute; top: -1px; width: 26px; height: 3px;
  border-radius: 0 0 4px 4px; background: var(--accent);
}

/* ===== 卡片 ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow-soft);
}
.card + .card, .card + .section, .section + .card { margin-top: 14px; }
.section { margin-top: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-head h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
.card-head .sub { font-size: 12px; color: var(--text-2); }
.muted { color: var(--text-2); }
.tiny { font-size: 12px; }
.right { text-align: right; }

/* ===== 主卡片（今日主线） ===== */
.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-ink) 100%);
  color: #fff;
  border: none;
  box-shadow: 0 14px 30px -16px var(--accent);
}
.hero::after {
  content: ""; position: absolute; right: -40px; top: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255,255,255,.10);
}
.hero .hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; letter-spacing: .4px;
  background: rgba(255,255,255,.18); padding: 5px 11px; border-radius: 999px;
}
.hero h2 { font-size: 25px; font-weight: 800; margin: 12px 0 2px; letter-spacing: -.5px; position: relative; }
.hero .hero-line { font-size: 13.5px; color: rgba(255,255,255,.85); margin: 8px 0 0; position: relative; }
.hero .hero-output {
  margin-top: 14px; padding: 12px 14px; border-radius: 14px;
  background: rgba(255,255,255,.14);
  position: relative;
}
.hero .hero-output .lbl { font-size: 11.5px; opacity: .85; letter-spacing: .3px; }
.hero .hero-output .val { font-size: 15px; font-weight: 700; margin-top: 2px; }
.hero .hero-etime { font-size: 12.5px; color: rgba(255,255,255,.9); margin-top: 10px; }
.hero .hero-actions { display: flex; gap: 8px; margin-top: 14px; position: relative; }
.hero .ghost-btn {
  flex: 1; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 13.5px;
  background: rgba(255,255,255,.18); color: #fff;
}
.hero .ghost-btn:active { background: rgba(255,255,255,.28); }

/* ===== 顶部状态条（今日） ===== */
.today-top { display: flex; gap: 12px; align-items: stretch; }
.today-top .tt-left { flex: 1; }
.today-top .tt-date { font-size: 13px; color: var(--text-2); }
.today-top .tt-time { font-size: 26px; font-weight: 800; letter-spacing: -.4px; margin-top: 2px; }
.today-top .tt-time small { font-size: 14px; font-weight: 600; color: var(--text-2); }
.progress-donut { position: relative; width: 64px; height: 64px; flex: 0 0 auto; }
.progress-donut svg { transform: rotate(-90deg); }
.progress-donut .pd-num {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 14px; font-weight: 800;
}

/* 可用时间选择 chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface-soft); color: var(--text-2); border: 1px solid transparent;
}
.chip.active { background: var(--accent-soft); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

/* ===== 路线步骤 ===== */
.step {
  display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft);
}
.step:last-child { border-bottom: none; padding-bottom: 0; }
.step-badge {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; font-size: 13px;
  background: var(--accent-soft); color: var(--accent-ink);
}
.step.done .step-badge { background: var(--up); color: #fff; }
.step-body { flex: 1; min-width: 0; }
.step-title { font-weight: 650; font-size: 14.5px; }
.step-meta { font-size: 12px; color: var(--text-2); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.step-timer { font-variant-numeric: tabular-nums; }
.step-actions { display: flex; gap: 6px; margin-top: 8px; }
.mini-btn {
  padding: 6px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 650;
  background: var(--surface-soft); color: var(--text);
}
.mini-btn.primary { background: var(--accent); color: #fff; }
.mini-btn.success { background: var(--up); color: #fff; }
.mini-btn:active { opacity: .8; }
.mini-btn[disabled] { opacity: .4; }

/* ===== 关联任务小卡 ===== */
.mini-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 13px; position: relative;
  box-shadow: var(--shadow-soft);
}
.mini .m-ico { font-size: 17px; }
.mini .m-title { font-size: 12px; color: var(--text-2); margin: 4px 0 2px; font-weight: 600; }
.mini .m-val { font-size: 14px; font-weight: 700; line-height: 1.35; }
.mini .m-val.small { font-size: 13px; font-weight: 600; color: var(--text); }
.mini .m-go { position: absolute; top: 12px; right: 12px; font-size: 16px; color: var(--text-3); }
.mini.full { grid-column: 1 / -1; }
.mini .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; margin-top:6px;}
.pill.up { background: var(--up-soft); color: var(--up); }
.pill.down { background: var(--down-soft); color: var(--down); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-soft); color: var(--text-2); }

/* ===== 通用按钮 ===== */
.btn {
  width: 100%; padding: 13px; border-radius: 13px; font-size: 15px; font-weight: 700;
  background: var(--surface-soft); color: var(--text);
  transition: transform .1s ease, filter .1s ease;
}
.btn:active { transform: scale(.985); filter: brightness(.97); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px -10px var(--accent); }
.btn-ghost { background: transparent; border: 1px solid var(--line); }
.btn-sm { width: auto; padding: 9px 16px; font-size: 14px; }
.btn[disabled] { opacity: .45; }

/* ===== 列表 ===== */
.list { display: flex; flex-direction: column; }
.item {
  display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line-soft);
}
.item:last-child { border-bottom: none; }
.item.taptic:active { background: var(--surface-soft); }
.item-ico { font-size: 20px; flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display:grid; place-items:center; background: var(--surface-soft); }
.item-main { flex: 1; min-width: 0; }
.item-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.item-title { font-weight: 650; font-size: 14.5px; }
.item-sub { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.item-right { flex: 0 0 auto; text-align: right; font-size: 13px; color: var(--text-2); display:flex; align-items:center; gap:8px; }
.item-arrow { color: var(--text-3); font-size: 18px; }

/* ===== 表单 ===== */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 650; color: var(--text-2); margin-bottom: 6px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 12px 13px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  outline: none; transition: border .15s ease, box-shadow .15s ease;
}
.field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field .hint { font-size: 11.5px; color: var(--text-3); margin-top: 5px; }
.seg { display: flex; background: var(--surface-soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 9px; border-radius: 9px; font-size: 13px; font-weight: 650; color: var(--text-2); }
.seg button.active { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow-soft); }

/* ===== 空状态 ===== */
.empty {
  text-align: center; padding: 36px 20px; color: var(--text-3);
}
.empty .e-ico { font-size: 38px; }
.empty .e-title { font-size: 15px; font-weight: 700; color: var(--text-2); margin-top: 10px; }
.empty .e-sub { font-size: 13px; margin-top: 4px; }

/* ===== 统计数字 ===== */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 13px;
}
.stat .s-val { font-size: 21px; font-weight: 800; letter-spacing: -.4px; }
.stat .s-lbl { font-size: 12px; color: var(--text-2); margin-top: 2px; }

/* ===== 模态 ===== */
.modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
.modal-root.open { display: block; }
.modal-mask { position: absolute; inset: 0; background: rgba(15,15,25,.45); backdrop-filter: blur(2px); }
.modal-card {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
  background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 22px 18px calc(22px + var(--safe-bottom));
  box-shadow: 0 -10px 40px -10px rgba(0,0,0,.3);
  animation: slideUp .26s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.modal-head h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
.modal-close { font-size: 22px; color: var(--text-3); width: 32px; height: 32px; display:grid; place-items:center; }

/* ===== 轻提示 ===== */
.toast-root { position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--safe-bottom) + 18px); transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: rgba(28,28,30,.92); color: #fff; padding: 11px 18px; border-radius: 12px;
  font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 24px -8px rgba(0,0,0,.5);
  animation: toastIn .2s ease; max-width: 88vw; text-align: center;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 图表 ===== */
.chart-wrap { width: 100%; overflow: hidden; }
.chart-wrap svg { width: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 12px; }
.legend .lg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.legend .dot { width: 9px; height: 9px; border-radius: 3px; }

/* 资产行 */
.alloc-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.alloc-row:last-child { border-bottom: none; }
.alloc-name { flex: 0 0 90px; font-weight: 650; font-size: 13.5px; }
.alloc-bar { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-soft); position: relative; overflow: hidden; }
.alloc-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--accent); }
.alloc-bar .target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
.alloc-pct { flex: 0 0 56px; text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.alloc-status { flex: 0 0 auto; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.alloc-status.over { background: var(--down-soft); color: var(--down); }
.alloc-status.under { background: var(--warn-soft); color: var(--warn); }
.alloc-status.ok { background: var(--up-soft); color: var(--up); }

/* 标签 / 分类 */
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-soft); color: var(--text-2); }
.tag.ai { background: color-mix(in srgb, var(--c-ai) 14%, transparent); color: var(--c-ai); }
.tag.en { background: color-mix(in srgb, var(--c-en) 16%, transparent); color: var(--c-en); }
.tag.build { background: color-mix(in srgb, var(--c-build) 14%, transparent); color: var(--c-build); }
.tag.wealth { background: var(--gold-soft); color: var(--gold); }

window.U = (function () {
  const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const pad = n => String(n).padStart(2, '0');

  function uid(prefix = 'id') {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function todayStr(d = new Date()) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function weekday(d = new Date()) { return WEEK[d.getDay()]; }
  function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return todayStr(d); }
  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
  function fmtDateCN(s) { const d = parseDate(s); return `${d.getMonth() + 1}月${d.getDate()}日`; }
  function fmtMonth(s) { const d = parseDate(s); return `${d.getMonth() + 1}月`; }

  // 金额格式化（按币种符号）
  const SYM = { CNY: '¥', USD: '$', HKD: 'HK$', JPY: '¥' };
  function money(n, currency = 'CNY', opts = {}) {
    const v = Number(n) || 0;
    const sym = SYM[currency] || '';
    const abs = Math.abs(v);
    let s;
    if (abs >= 100000000) s = (v / 100000000).toFixed(2) + '亿';
    else if (abs >= 10000) s = (v / 10000).toFixed(2) + '万';
    else s = v.toLocaleString('zh-CN', { maximumFractionDigits: 0 });
    if (opts.sign && v > 0) s = '+' + s;
    return sym + s;
  }
  function moneyExact(n, currency = 'CNY') {
    const v = Number(n) || 0;
    const sym = SYM[currency] || '';
    return sym + v.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  }
  function pct(n, withSign = true) {
    const v = Number(n) || 0;
    const s = v.toFixed(1) + '%';
    return withSign && v > 0 ? '+' + s : s;
  }
  function num(n, d = 0) { return Number(n || 0).toLocaleString('zh-CN', { maximumFractionDigits: d }); }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function avg(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }

  // 轻提示
  function toast(msg, ms = 1900) {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 260); }, ms);
  }

  // 颜色：根据类别返回 css 变量色
  function catColor(cat) {
    return ({ ai: 'var(--c-ai)', en: 'var(--c-en)', build: 'var(--c-build)', wealth: 'var(--c-wealth)', body: 'var(--c-body)', content: 'var(--c-content)' })[cat] || 'var(--accent)';
  }

  return { WEEK, pad, uid, todayStr, weekday, parseDate, addDays, daysBetween, fmtDateCN, fmtMonth, money, moneyExact, pct, num, escapeHtml, clamp, avg, toast, catColor };
})();

      storage.setItem(KEY, JSON.stringify(data));

  }

  /* 自动云端备份：每次保存后把数据推送到服务器，清缓存/换设备也能找回 */
  function backupToCloud() {
    try {
      if (typeof fetch !== 'function') return;
      fetch('/__backup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: data, ts: Date.now() })
      }).catch(function () {});
    } catch (e) {}
  }

  /* 从云端备份恢复；返回 data 对象或 null */
  function restoreFromBackup() {
    return new Promise(function (resolve) {
      try {
        if (typeof fetch !== 'function') return resolve(null);
        fetch('/__backup').then(function (r) {
          if (!r.ok) return resolve(null);
          return r.json();
        }).then(function (j) {
          if (j && j.data && Object.keys(j.data).length) resolve(j.data);
          else resolve(null);
        }).catch(function () { resolve(null); });
      } catch (e) { resolve(null); }
    });
  }

  function forceBackup() { backupToCloud(); }

  function reset() { data = defaults(); save(); }

  // 通用集合 CRUD
  function list(name) { return (data[name] || []).slice(); }
  function find(name, id) { return (data[name] || []).find(x => x.id === id); }
  function add(name, item) {
    if (!data[name]) data[name] = [];
    if (!item.id) item.id = U.uid(name.slice(0, 2));
    data[name].push(item); save(); return item;
  }
  function update(name, id, patch) {
    const it = find(name, id); if (!it) return null;
    Object.assign(it, patch); save(); return it;
  }
  function remove(name, id) {
    if (!data[name]) return;
    data[name] = data[name].filter(x => x.id !== id); save();
  }

  // 顶层对象（profile / settings / dailyPlans）
  function get(key) { return data[key]; }
  function set(key, value) { data[key] = value; save(); }

  function setData(obj) { data = obj; save(); }

  function exportJSON() { return JSON.stringify(data, null, 2); }
  function importJSON(str) {
    const obj = JSON.parse(str);
    data = Object.assign(defaults(), obj);
    save();
  }

  return { load, save, reset, list, find, add, update, remove, get, set, setData, exportJSON, importJSON,
    backupToCloud, restoreFromBackup, forceBackup,
    get data() { return data; } };
})();

    const total = segments.reduce((a, s) => a + s.value, 0) || 1;
    const r = size / 2 - 16;
    const c = 2 * Math.PI * r;
    let off = 0, arcs = '';
    segments.forEach(s => {
      const frac = s.value / total;
      const len = frac * c;
      arcs += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="15" stroke-linecap="butt" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"></circle>`;
      off += len;
    });
    const center = opts.center ? `<text x="${size/2}" y="${size/2-2}" text-anchor="middle" font-size="${opts.centerSize||15}" font-weight="800" fill="var(--text)">${opts.center}</text><text x="${size/2}" y="${size/2+15}" text-anchor="middle" font-size="11" fill="var(--text-2)">${opts.centerSub||''}</text>` : '';
    return `<svg viewBox="0 0 ${size} ${size}" role="img">${arcs}${center}</svg>`;
  }

  // 折线图：series=[{name,color,values:[..]}], labels=[..]
  function line(series, labels, opts = {}) {
    const W = 340, H = opts.height || 170, padL = 34, padR = 10, padT = 14, padB = 22;
    const all = series.flatMap(s => s.values);
    let min = Math.min(...all), max = Math.max(...all);
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.12; min -= pad; max += pad;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const n = labels.length;
    const xAt = i => padL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
    const yAt = v => padT + innerH - ((v - min) / (max - min)) * innerH;

    // 网格 + y 标签
    let grid = '', yt = '';
    const steps = 3;
    for (let i = 0; i <= steps; i++) {
      const v = min + (max - min) * (i / steps);
      const y = yAt(v);
      grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"></line>`;
      yt += `<text x="${padL-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-3)">${(opts.yfmt?opts.yfmt(v):Math.round(v))}</text>`;
    }
    // x 标签（最多 6 个）
    let xt = '';
    const stepX = Math.max(1, Math.ceil(n / 6));
    for (let i = 0; i < n; i += stepX) {
      xt += `<text x="${xAt(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--text-3)">${labels[i]}</text>`;
    }
    // 折线
    let paths = '', areas = '';
    series.forEach((s, si) => {
      const pts = s.values.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
      if (opts.area && si === 0) {
        const base = `${xAt(0).toFixed(1)},${yAt(min).toFixed(1)}`;
        const end = `${xAt(n-1).toFixed(1)},${yAt(min).toFixed(1)}`;
        const gid = 'g' + si + Math.random().toString(36).slice(2, 6);
        areas = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s.color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><polygon points="${base} ${pts} ${end}" fill="url(#${gid})"></polygon>`;
      }
      paths += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" ${si>0?'opacity="0.9"':''}></polyline>`;
      // 末点圆
      const lx = xAt(n-1), ly = yAt(s.values[n-1]);
      paths += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3" fill="${s.color}"></circle>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${yt}${areas}${paths}${xt}</svg>`;
  }

  // 柱状图：items=[{label,value,color}]
  function bar(items, opts = {}) {
    const W = 340, H = opts.height || 160, padB = 24, padT = 10;
    const max = Math.max(...items.map(i => i.value), 1) * 1.15;
    const n = items.length;
    const slot = W / n, bw = Math.min(26, slot * 0.55);
    const H2 = H - padB - padT;
    let bars = '', xt = '';
    items.forEach((it, i) => {
      const h = (it.value / max) * H2;
      const x = i * slot + (slot - bw) / 2;
      const y = padT + (H2 - h);
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${it.color}"></rect>`;
      bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text-2)">${opts.vfmt?opts.vfmt(it.value):Math.round(it.value)}</text>`;
      xt += `<text x="${(i*slot+slot/2).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="9" fill="var(--text-3)">${it.label}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${bars}${xt}</svg>`;
  }

  return { donut, line, bar };
})();

  /* \u8bcd\u6027\u6807\u6ce8 */
  function _posTag(word) {
    var w = word.replace(/[^a-zA-Z']/g,'').toLowerCase();
    if (!w) return 'punct';
    if (_AUX.has(w)) return 'aux';
    if (_BE.has(w)) return 'be';
    if (_VB_SET.has(w)) return 'verb';
    if (_ADJ_SET.has(w)) return 'adj';
    if (_NOUN_SET.has(w)) return 'noun';
    /* \u540e\u7f00\u63a8\u65ad */
    if (/(ful|less|ous|ive|al|ent|ant|able|ible|ary|ory)$/.test(w)) return 'adj';
    if (/(ly)$/.test(w) && w.length > 3) return 'adv';
    if (/(tion|sion|ment|ness|ity|ism|age|ure|ance|ence|er|or|ist)$/.test(w)) return 'noun';
    if (/(ate|ify|ise|ize|ed|ing)$/.test(w)) {
      if (w.endsWith('ing')) return 'ving';  /* \u73b0\u5728\u5206\u8bcd/\u52a8\u540d\u8bcd */
      return 'verb';
    }
    return 'unk';
  }

  /* \u662f\u5426\u53ef\u80fd\u662f\u590d\u6570\u4e3b\u8bed */
  function _likelyPlural(word) {
    var w = word.replace(/[^a-zA-Z]/g,'');
    return /(s|ses|shes|ches|xes|izes|ves|men|ie|data|media)$/.test(w.toLowerCase());
  }

  /* \u662f\u5426\u662f\u5355\u6570\u4e3b\u8bed\uff08\u4e0d\u542b\u4e13\u6709\u540d\u8bcd\uff09 */
  function _likelySingular(word) {
    var w = word.replace(/[^a-zA-Z]/g,'').toLowerCase();
    if (/(s|ses|shes|ches|xes|ves|men|data|media)$/.test(w)) return false;
    return true;
  }

  /* \u8bed\u6cd5\u89c4\u5219\u5f15\u64ce */
  function _grammarCheck(words, lesson) {
    var errs = [], warns = [];
    var tags = words.map(function(w){ return {w:w,t:_posTag(w)}; });
    var lowerSen = words.map(function(w){return w.toLowerCase();});

    /* \u89c4\u52191: \u5f62\u5bb9\u8bcd\u88ab\u5f53\u6210\u52a8\u8bcd\u4f7f\u7528 (\u4e3b\u8bed+\u5f62\u5bb9\u8bcd+\u5176\u4ed6)
       \u4f8b: "What expats essential is money" \u2192 essential \u662f adj\uff0c\u4e0d\u80fd\u505a\u8c13\u8bed */
    for (var i=1;i<tags.length-1;i++){
      var prev=tags[i-1], cur=tags[i], next=tags[i+1];
      /* \u524d\u9762\u662f\u540d\u8bcd/\u4ee3\u8bcd(\u4e3b\u8bed)\uff0c\u5f53\u524d\u662f\u5f62\u5bb9\u8bcd\uff0c\u540e\u9762\u4e0d\u662f be \u52a8\u8bcd\u6216\u7cfb\u52a8\u8bcd */
      if ((prev.t==='noun'||prev.t==='unk'||(prev.w.match(/^[A-Z]/)&&i<=1))
          && cur.t==='adj' && next.t!=='be' && next.t!=='aux'){
        /* \u4f46\u8981\u6392\u9664 "make/have/keep/get + noun + adj" \u7ed3\u6784 */
        var prevVerb = (i>=2 && (tags[i-2].t==='verb'||tags[i-2].t==='aux'));
        if(!prevVerb){
          errs.push({
            msg: '\u300c' + cur.w + '\u300d \u662f\u5f62\u5bb9\u8bcd\uff0c\u4e0d\u80fd\u76f4\u63a5\u505a\u8c13\u8bed\u3002\u8fd9\u91cc\u9700\u8981\u4e00\u4e2a\u771f\u6b63\u7684\u52a8\u8bcd\u3002',
            fix: '\u5efa\u8bae\u6539\u4e3a\u52a8\u8bcd\uff08\u5982 need/want/require/love/have/make \u7b49\uff09\uff0c\u6216\u8005\u7528 be + \u5f62\u5bb9\u8bcd\u7ed3\u6784\u3002',
            pos: i
          });
        }
      }
    }

    /* \u89c4\u52192: S-V \u7ed3\u6784\u7f3a\u5c11\u52a8\u8\u8bcd
       \u68c0\u67e5: \u4e3b\u8bed(\u540d\u8bcd)\u540e\u76f4\u63a5\u8ddf\u4e86\u5f62\u5bb9\u8bcd/\u540d\u8bcd/\u526f\u8bcd\uff0c\u4e2d\u95f4\u6ca1\u6709\u52a8\u8bcd */
    for(var i=0;i<Math.min(tags.length-1,8);i++){
      var subj = tags[i];
      if(subj.t!=='noun'&&subj.t!=='unk') continue;
      /* \u627e\u5230\u4e3b\u8bed\u540e\uff0c\u770b\u540e\u9762 3 \u4e2a\u8bcd\u5185\u6709\u6ca1\u6709\u52a8\u8\u8bcd */
      var hasVerb=false, verbIdx=-1;
      for(var j=i+1;j<Math.min(i+4,tags.length);j++){
        if(tags[j].t==='verb'||tags[j].t==='aux'||tags[j].t==='be'){hasVerb=true;verbIdx=j;break;}
        if(tags[j].t==='adj'&&j===i+1){
          /* \u4e3b\u8bed\u540e\u7b26\u7b26\u76f4\u63a5\u8ddf\u5f62\u5bb9\u8bcd = \u53ef\u80fd\u7f3a\u52a8\u8bcd */
          if(i>0||subj.w.match(/^[A-Z]/)){
            /* \u786e\u4fdd\u4e0d\u662f there is / it is \u5f00\u5934 */
            var prevW = i>0 ? tags[i-1].w.toLowerCase() : '';
            if(prevW!=='there'&&prevW!=='it'&&prevW!=='this'&&prevW!=='that'){
              errs.push({
                msg: '\u300c' + subj.w + ' ' + tags[j].w + '\u300d \u2014\u2014 \u4e3b\u8bed\u540e\u76f4\u63a5\u8ddf\u5f62\u5bb9\u8bcd\uff0c\u4e2d\u95f4\u7f3a\u5c11\u52a8\u8bcd\u3002',
                fix: '\u5728\u4e3b\u8bed\u548c\u5f62\u5bb9\u8bcd\u4e4b\u95f4\u52a0\u4e00\u4e2a be \u52a8\u8bcd\uff08is/am/are/was/were\uff09\uff0c\u6216\u8005\u628a\u5f62\u5bb9\u8bcd\u6362\u6210\u52a8\u8bcd\u3002',
                pos: j
              });
            }
          }
        }
      }
    }

    /* \u89c4\u52193: \u4e3b\u8c13\u4e00\u81f4\u6027 (he/she/it + \u5355\u6570\u52a8\u8\u8bcd; I/we/they/you + \u590d\u6570) */
    var subjMap = {'i':'sg','he':'sg','she':'sg','it':'sg','this':'sg','that':'sg',
                   'we':'pl','they':'pl','you':'pl','these':'pl','those':'pl'};
    for(var i=0;i<tags.length-1;i++){
      var tw = tags[i].w.toLowerCase();
      if(subjMap[tw]==='sg'||subjMap[tw]==='pl'){
        var nxt = tags[i+1];
        var expected = subjMap[tw]==='sg'?'s':'';
        /* \u68c0\u67e5\u52a8\u8\u8bcd\u662f\u5426\u6709 s \u540e\u7f00 */
        if(nxt.t==='verb'||nxt.t==='aux'){
          var vb = nxt.w.toLowerCase();
          if(vb.endsWith('s')&&expected===''&&!_MODALS.has(vb)){
            warns.push({
              msg: '\u300c'+tw+' '+nxt.w+'\u300d \u2014\u2014 \u4e3b\u8bed\u662f\u590d\u6570\uff0c\u52a8\u8bcd\u4e0d\u5e94\u8be7\u52a0 s\u3002',
              fix: '\u53bb\u6389\u52a8\u8bcd\u7684 s\uff0c\u6216\u8005\u68c0\u67e5\u4e3b\u8bed\u662f\u5426\u5e94\u8be5\u662f\u5355\u6570\u3002',
              pos: i+1
            });
          } else if(!vb.endsWith('s')&&expected==='s'&&!_BE.has(vb)&&!_MODALS.has(vb)&&vb!=='was'&&vb!=='were'){
            warns.push({
              msg: '\u300c'+tw+' '+nxt.w+'\u300d \u2014\u2014 \u4e3b\u8bed\u662f\u7b2c\u4e09\u4eba\u79f0\u5355\u6570\uff0c\u52a8\u8bcd\u901a\u5e38\u9700\u8981\u52a0 s\u3002',
              fix: '\u52a8\u8bcd\u52a0 s\uff08\u5982 goes \u2192 go\uff0cneeds \u2192 need\uff09\uff0c\u6216\u8005\u68c0\u67e5\u662f\u5426\u5e94\u8be7\u7528 was/were/is/are\u3002',
              pos: i+1
            });
          }
        }
      }
    }

    /* \u89c4\u52194: \u8bfe\u6586\u7279\u5b9a\u8bed\u6cd5\u70b9\u6821\u9a8c */
    if(lesson && lesson.grammar && lesson.grammar.point){
      var gp = lesson.grammar.point;
      var gex = lesson.grammar.ex || '';

      /* overseas: what-\u5f15\u5bfc\u7684\u540d\u8bcd\u6027\u4ece\u53e5 "What ... is ..." */
      if(gp.indexOf('what')!==-1 || gp.indexOf('\u4ece\u53e5')!==-1){
        var whatIdx = lowerSen.indexOf('what');
        if(whatIdx >= 0 && whatIdx < words.length - 3){
          /* What + noun + ??? + is + ... \u7ed3\u6784 */
          var afterWhat = tags.slice(whatIdx+1);
          var hasIs = false, isPos = -1;
          for(var k=0;k<afterWhat.length;k++){
            if(afterWhat[k].w.toLowerCase()==='is'||afterWhat[k].w.toLowerCase()==='was'){hasIs=true;isPos=whatIdx+1+k;break;}
          }
          if(hasIs && isPos > whatIdx+2){
            /* what \u548c is \u4e4b\u95f4\u5e94\u8be5\u6709\u4e3b\u8bed+\u52a8\u8bcd */
            var midTags = tags.slice(whatIdx+1, isPos);
            var midVerbs = midTags.filter(function(t){return t.t==='verb'||t.t==='aux';});
            var midAdjs = midTags.filter(function(t){return t.t==='adj';});
            if(midVerbs.length===0 && midAdjs.length>0){
              errs.push({
                msg: '\u8bed\u6cd8\u70b9\u662f what \u4ece\u53e5\uff0c\u4f46 What \u548c is \u4e4b\u95f4\u7f3a\u5c11\u52a8\u8bcd\u3002\u300c' + midAdjs.map(function(t){return t.w;}).join(' ') + '\u300d \u662f\u5f62\u5bb9\u8bcd\u3002',
                fix: '\u6b63\u786e\u7ed3\u6784: What + \u4e3b\u8bed + \u52a8\u8bcd + is + \u8868\u8bed\u3002\u4f8b: What expats <b>need</b> is routine.',
                pos: whatIdx+1
              });
            } else if(midTags.length===1 && midTags[0].t==='noun'){
              /* What expats is... \u2192 \u7f3a\u52a8\u8bcd */
              errs.push({
                msg: 'What \u4ece\u53e5\u4e2d What \u540e\u7684\u540d\u8bcd\u548c is \u4e4b\u95f4\u5e94\u8be5\u6709\u52a8\u8bcd\u3002',
                fix: '\u4f8b: What expats <b>need</b> is routine. / What <b>matters</b> most is money.',
                pos: whatIdx+1
              });
            }
          }
        }
      }

      /* AI \u8bfe: \u73b0\u5728\u8fdb\u884c\u65f6 are being / are moving */
      if(gp.indexOf('\u8fdb\u884c\u65f6')!==-1||gp.indexOf('being')!==-1){
        var hasBeing = lowerSen.indexOf('being')>=0 || lowerSen.indexOf('moving')>=0;
        if(!hasBeing && (lowerSen.indexOf('are')>=0||lowerSen.indexOf('is')>=0)){
          /* \u5982\u679c\u7528\u4e86 are/is \u4f46\u6ca1\u6709 being/-ing\uff0c\u63d0\u9192 */
          var hasIng = words.some(function(w){return w.endsWith('ing');});
          if(!hasIng){
            warns.push({
              msg: '\u672c\u8bfe\u8bed\u6cd8\u70b9\u662f\u73b0\u5728\u8fdb\u884c\u65f6\uff08are/is being + \u8fc7\u53bb\u5206\u8bcd\uff09\uff0c\u4f60\u7684\u53e5\u5b50\u6ca1\u6709\u7528\u5230 -ing \u5f62\u5f0f\u3002',
              fix: '\u8bd5\u7740\u7528 are being done / is moving \u7b49\u7ed3\u6784\u6765\u8868\u793a\u6b63\u5728\u53d1\u751f\u7684\u52a8\u4f5c\u3002',
              pos: 0
            });
          }
        }
      }

      /* invest/career: \u6bd4\u8f83\u7ea7 + than */
      if(gp.indexOf('\u6bd4\u8f83\u7ea7')!==-1||gp.indexOf('than')!==-1){
        var hasThan = lowerSen.indexOf('than')>=0;
        var hasComp = /\b(more|less|better|worse|higher|lower|bigger|smaller|faster|slower|stronger|weaker|richer|poorer|easier|harder)\b/i.test(senStr(words));
        if(!hasThan && !hasComp){
          warns.push({
            msg: '\u672c\u8bfe\u8bed\u6cd8\u70b9\u5305\u542b\u6bd4\u8f83\u7ea7\u7ed3\u6784\uff08\u539f\u7ea7 + than + \u6bd4\u8f83\u7ea7\uff09\uff0c\u5efa\u8bae\u8bd5\u7740\u7528\u51fa\u6765\u3002',
            fix: '\u4f8b: ...is <b>better</b> than... / ...<b>more</b> effective than...',
            pos: 0
          });
        }
      }
    }

    /* \u89c4\u52195: \u5e38\u89c1\u9519\u8bef\u6a21\u5f0f */
    var sen = senStr(words);

    /* "very" + \u5426\u5b9a\u52a8\u8bcd/\u5f62\u5bb9\u8bcd = \u9519\u8bef */
    if(/\bvery\s+(can|could|should|must|will|would|may|might|do|does|did|is|am|are|was|were|have|has|had)\b/i.test(sen)){
      errs.push({msg:'\u300cvery\u300d \u4e0d\u80fd\u4fee\u9970\u52a8\u8bcd/\u6a21\u6001\u52a8\u8bcd\u3002',fix:'\u53bb\u6389 very\uff0c\u6216\u6539\u7528 really/truly/absolutely\u3002',pos:-1});
    }
    /* \u526f\u8bcd + \u5f62\u5bb9\u8bcd (\u5e94\u8be5\u662f \u526f\u8bcd+\u52a8\u8bcd/\u5f62\u5bb9\u8bcd) */
    for(var ai=0;ai<tags.length-1;ai++){
      if(tags[ai].t==='adv' && tags[ai+1].t==='noun'){
        var advW = tags[ai].w.toLowerCase();
        if(/^(very|really|quite|rather|too|so|how|more|most|less|least|still|just|always|never|often|usually|sometimes|already|soon|here|there|now|then|today|tomorrow|yesterday)$/.test(advW)){
          warns.push({msg:'\u300c'+tags[ai].w+' '+tags[ai+1].w+'\u300d \u2014\u2014 \u526f\u8bcd\u540e\u9762\u901a\u5e38\u5e94\u8be7\u63a5\u52a8\u8bcd/\u5f62\u5bb9\u8bcd\uff0c\u800c\u4e0d\u662f\u540d\u8bcd\u3002',fix:'\u68c0\u67e5\u8fd9\u4e24\u4e2a\u8bcd\u7684\u6392\u5217\u987a\u5e8f\u662f\u5426\u6b63\u786e\u3002',pos:ai+1});
        }
      }
    }

    return {errs:errs,warns:warns};
  }

  function senStr(words){return words.join(' ');}

  /* ---------- sentence checker (\u5347\u7ea7\u7248: \u542b\u8bed\u6cd5\u89c4\u5219\u5f15\u64ce) ---------- */
  function checkSentence(sentence, lesson) {
    var s = (sentence || '').trim();
    if (!s) return { empty: true };
    var hasChinese = /[\u4e00-\u9fff]/.test(s);
    if (hasChinese) return { hasChinese: true, pts:["\u68c0\u6d4b\u5230\u4e2d\u6587\u5185\u5bb9\uff0c\u7ec3\u4e60\u8bf7\u7528\u4e2d\u6587\u610f\u601d\u5bf9\u5e94\u7684\u82f1\u6587\u6765\u8868\u8fbe"], sugg:["\u8bd5\u7740\u53ea\u7528\u82f1\u6587\u5199\uff1b\u4e0d\u4f1a\u7684\u8bcd\u7528\u7b80\u5355\u8bcd\u66ff\u6362\u4e5f\u6ca1\u5173\u7cfb"] };

    var words = s.split(/\s+/).filter(Boolean);
    var pts = [], sugg = [];

    /* \u57fa\u7840\u68c0\u67e5 */
    if (/^[A-Z]/.test(s)) pts.push("\u9996\u5b57\u6bcd\u5927\u5199 \u2713"); else sugg.push("\u82f1\u6587\u53e5\u5b50\u5f00\u5934\u5efa\u8bae\u5927\u5199\u3002");
    if (/[.?!]$/.test(s)) pts.push("\u53e5\u672b\u6709\u6807\u70b9 \u2713"); else sugg.push("\u53e5\u672b\u52a0\u4e00\u4e2a\u53e5\u53f7 / \u95ee\u53f7\u3002");
    if (words.length < 4) sugg.push("\u53e5\u5b50\u504f\u77ed\uff0c\u8bd5\u7740\u5199\u4e00\u53e5\u5b8c\u6574\u7684\u8bdd\uff08\u542b\u4e3b\u8c13\u5bbe\uff0c\u81f3\u5c11 4\u20135\u4e2a\u8bcd\uff09\u3002");

    /* \u8bcd\u6c47\u4f7f\u7528\u68c0\u67e5 */
    var lessonWords = (lesson.words || []).map(function(w){return w.w.toLowerCase();});
    var used = lessonWords.filter(function(lw){return s.toLowerCase().includes(lw);});
    if (used.length) pts.push("\u7528\u5230\u4e86\u672c\u8bfe\u8bcd\u6c47\uff1a" + used.join("\u3001") + " \u2713");
    else if (lesson.words && lesson.words[0]) sugg.push("\u8bd5\u7740\u628a\u672c\u8bfe\u7684\u4e00\u4e2a\u91cd\u70b9\u8bcd\uff08\u5982 " + lesson.words[0].w + "\uff09\u7528\u8fdb\u53e5\u5b50\u91cc\u3002");

    /* ===== \u8bed\u6cd5\u89c4\u5219\u5f15\u64ce\uff08\u6838\u5fc3\u5347\u7ea7\uff09===== */
    var gr = _grammarCheck(words, lesson);

    /* \u9519\u8bef\uff08\u7ea2\u8272\uff09 */
    if(gr.errs.length > 0){
      gr.errs.forEach(function(e){
        sugg.push("\u274c " + e.msg + (e.fix?" \u2192 "+e.fix:""));
      });
    }
    /* \u8b66\u544a\uff08\u6a59\u8272\uff09 */
    if(gr.warns.length > 0){
      gr.warns.forEach(function(w){
        sugg.push("\u26a0\ufe0f " + w.msg + (w.fix?" \u2192 "+w.fix:""));
      });
    }

    /* \u8ba1\u7b97\u5206\u6570: \u57fa\u7840\u5206 + \u8bed\u6cd3\u6263\u5206 */
    var basePts = pts.length;
    var penalty = gr.errs.length * 25 + gr.warns.length * 12;
    var score = Math.max(20, Math.min(100, basePts * 20 + (gr.errs.length===0 && gr.warns.length===0 ? 40 : 16) - penalty));

    /* \u5982\u679c\u6709\u8bed\u6cd5\u9519\u8bef\uff0c\u5728 pts \u4e2d\u4e5f\u663e\u793a\u4e00\u6761\u603b\u7ed3 */
    if(gr.errs.length > 0){
      pts.push("\u8bed\u6cd5\u68c0\u67e5: \u53d1\u73b0 " + gr.errs.length + " \u4e2a\u95ee\u9898 \u2717");
    } else if(gr.warns.length > 0){
      pts.push("\u8bed\u6cd5\u68c0\u67e5: \u57fa\u672c\u6b63\u786e\uff0c" + gr.warns.length + " \u5904\u53ef\u4f18\u5316 \u25b6");
    } else {
      pts.push("\u8bed\u6cd5\u68c0\u67e5: \u7ed3\u6784\u6b63\u786e \u2713");
    }

    return { pts:pts, sugg:sugg, score:score, used:used, errCount:gr.errs.length, warnCount:gr.warns.length };
  }

  /* ---------- exercise parser ---------- */
  function parseExercise(text) {
    const txt = text || '';
    let type = '\u5176\u4ed6';
    if (/\u6709\u6c27|\u8dd1\u6b65|jog|run|\u9a91\u8f66|\u9a91\u884c/.test(txt)) type = '\u6709\u6c27';
    else if (/\u745c\u4f3c|yoga|\u666e\u62c9\u63d0|pilates|\u62c9\u4f38/.test(txt)) type = 'Pilates / \u745c\u4f3c';
    else if (/\u529b\u91cf|\u64c8\u94c1|\u4e3e\u94c1|\u5668\u68b0|\u5065\u8eab/.test(txt)) type = '\u529b\u91cf\u8bad\u7ec3';
    else if (/\u81c0|\u6df1\u8e72/.test(txt)) type = '\u81c0\u817f';
    else if (/\u8170\u8170|\u5377\u8170|\u6838\u5fc3|\u8170/.test(txt)) type = '\u8170\u8170';
    else if (/\u4e0a\u80a2|\u624b\u81c2|\u4e8c\u5934|\u4e09\u5934/.test(txt)) type = '\u4e0a\u80a2';
    else if (/\u80cc/.test(txt)) type = '\u80cc\u90e8';
    else if (/\u6b65\u884c|\u8d70\u8def|\u6563\u6b65|walk/.test(txt)) type = '\u6b65\u884c';
    else if (/\u6e38\u6cf3|swim/.test(txt)) type = '\u6e38\u6cf3';

    const durM = txt.match(/(\d+(\.\d+)?)\s*(\u5206\u949f|\u5206|min|mins)/i);
    const duration = durM ? Math.round(parseFloat(durM[1])) : 30;

    let intensity = '\u4e2d';
    if (/\u9ad8|\u5267\u70c8|\u7d2f|hard/.test(txt)) intensity = '\u9ad8';
    else if (/\u4f4e|\u8f7b\u677e|\u548c\u7f13|\u8212\u5c55/.test(txt)) intensity = '\u4f4e';

    const parts = [];
    if (/\u5168\u8eab|\u7efc\u5408/.test(txt)) parts.push('\u5168\u8eab');
    if (/\u81c0/.test(txt)) parts.push('\u81c0');
    if (/\u817f/.test(txt)) parts.push('\u817f');
    if (/\u8170\u8170|\u8170|\u6838\u5fc3/.test(txt)) parts.push('\u8170\u8170');
    if (/\u4e0a\u80a2|\u624b\u81c2/.test(txt)) parts.push('\u4e0a\u80a2');
    if (/\u80cc/.test(txt)) parts.push('\u80cc\u90e8');
    if (!parts.length) parts.push(type === '\u5176\u4ed6' ? '\u5168\u8eab' : '\u5168\u8eab');

    let feeling = '\u6b63\u5e38';
    if (/\u7d2f|\u723d|\u9178/.test(txt)) feeling = '\u7d2f\u4f46\u723d';
    else if (/\u8f7b\u677e|\u8212\u670d|\u8212\u5c55/.test(txt)) feeling = '\u8f7b\u677e';

    return { type, duration, intensity, bodyParts: parts, feeling, notes: txt };
  }

  /* ---------- body report ---------- */
  function bodyReport() {
    const d = S.data;
    const t = U.todayStr();
    const month = t.slice(0, 7);
    const ex = d.exercises.filter(e => e.date.startsWith(month));
    const w = d.weights.filter(x => x.date.startsWith(month));
    const days = new Set(ex.map(e => e.date)).size;
    const totalMin = ex.reduce((a, e) => a + (e.duration || 0), 0);
    const avgMin = ex.length ? Math.round(totalMin / ex.length) : 0;
    const typeCount = {};
    ex.forEach(e => { typeCount[e.type] = (typeCount[e.type] || 0) + 1; });
    const partCount = {};
    ex.forEach(e => (e.bodyParts || []).forEach(p => partCount[p] = (partCount[p] || 0) + 1));
    const wSorted = w.slice().sort((a,b)=>a.date.localeCompare(b.date));
    const first = wSorted[0], last = wSorted[wSorted.length - 1];
    const recent7 = wSorted.slice(-7).map(x => x.weight);
    const avg7 = recent7.length ? U.avg(recent7).toFixed(1) : '\u2014';

    const out = { month, days, totalMin, avgMin, typeCount, partCount, firstW: first && first.weight, lastW: last && last.weight, avg7, count: w.length };
    const suggestions = [];
    if (days < 8) suggestions.push('\u672c\u6708\u8fd0\u52a8\u5929\u6570\u504f\u5c11\uff0c\u5148\u5b9a\u4e00\u4e2a\u300c\u6bcf\u5468 3 \u6b21\u300d\u7684\u6700\u5c0f\u76ee\u6807\uff0c\u6bd4\u4e00\u6b21\u7ec3\u72e0\u66f4\u53ef\u6301\u7eed\u3002');
    else suggestions.push(`\u672c\u6708\u5df2\u8fd0\u52a8 ${days} \u5929\uff0c\u4e60\u60ef\u57fa\u672c\u7a33\u5b9a\uff0c\u4fdd\u6301\u8282\u594f\u3002`);
    const topPart = Object.entries(partCount).sort((a,b)=>b[1]-a[1])[0];
    if (topPart && topPart[1] > (ex.length * 0.5)) suggestions.push(`\u8bad\u7ec3\u4e3b\u8981\u96c6\u4e2d\u5728\u300c${topPart[0]}\u300d\uff0c\u4e0b\u6708\u53ef\u52a0\u5165\u4e0a\u80a2/\u80cc\u90e8\u4ee5\u5e73\u8861\u7ed3\u6784\u3002`);
    if (!partCount['\u4e0a\u80a2'] && !partCount['\u80cc\u90e8']) suggestions.push('\u8bb0\u5f55\u91cc\u7f3a\u5c11\u4e0a\u80a2/\u80cc\u90e8\u8bad\u7ec3\uff0c\u53ef\u6bcf\u5468\u5b89\u6392 1 \u6b21\uff0c\u6539\u5584\u4f53\u6001\u4e0e\u4ee3\u8c22\u3002');
    if (first && last) {
      const diff = (last.weight - first.weight).toFixed(1);
      suggestions.push(`\u4f53\u91cd\u4ece ${first.weight} \u5230 ${last.weight}kg\uff08${diff>=0?'+':''}${diff}\uff09\uff0c\u770b 7 \u65e5\u5747\u503c ${avg7}kg \u6bd4\u5355\u65e5\u66f4\u53ef\u9760\u3002`);
    }
    out.suggestions = suggestions;
    return out;
  }

    const last7 = d.learning.filter(l => U.daysBetween(l.date, t) <= 7);
    const last7Out = last7.filter(l => l.output && l.output !== '');
    const proj = d.projects.find(p => p.progress < 100);
    const findings = [];
    const cats = {};
    last7.forEach(l => cats[l.category] = (cats[l.category] || 0) + 1);
    const topCat = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
    if (topCat && topCat[1] >= 4) findings.push(`\u6700\u8fd1 7 \u5929\u4f60\u5728\u300c${catName(topCat[0])}\u300d\u4e0a\u5f88\u6d3b\u8dc3\uff08${topCat[1]} \u6b21\uff09\uff0c\u6ce8\u610f\u662f\u5426\u53ea\u5b66\u4e0d\u8f93\u51fa\u3002`);
    if (last7.length && last7Out.length / last7.length < 0.5) findings.push('\u6700\u8fd1\u5b66\u4e60\u504f\u591a\u4f46\u300c\u4ea7\u51fa\u300d\u504f\u5c11\u2014\u2014\u6bcf\u5929\u5c3d\u91cf\u7559\u4e00\u6b65\u505a\u53ef\u89c1\u7ed3\u679c\u3002');
    else if (last7Out.length) findings.push(`\u6700\u8fd1 7 \u5929\u6709 ${last7Out.length} \u6b21\u5b66\u4e60\u4ea7\u751f\u4e86\u4ea7\u51fa\uff0c\u4fdd\u6301\u8fd9\u4e2a\u8282\u594f\u3002`);
    if (proj && proj.progress < 50) findings.push(`\u9879\u76ee\u300c${proj.name}\u300d\u8fdb\u5ea6 ${proj.progress}%\uff0c\u5b83\u5728\u7b49\u4f60\u7684\u4e0b\u4e00\u6b65\u884c\u52a8\uff0c\u4eca\u5929\u4e3b\u7ebf\u5df2\u4e3a\u4f60\u6307\u5411\u5b83\u3002`);
    const txRecent = d.transactions.filter(x => U.daysBetween(x.date, t) <= 14).length;
    if (txRecent && !d.wealthSnapshots.some(s => U.daysBetween(s.date, t) <= 14)) findings.push('\u4f60\u6700\u8fd1\u6709\u4ea4\u6613\u4f46\u6ca1\u66f4\u65b0\u8d22\u5bcc\u5feb\u7167\uff0c\u8bb0\u5f97\u8bb0\u5f55\u4ee5\u4fbf\u770b\u5230\u771f\u5b9e\u589e\u957f\u3002');
    if (!findings.length) findings.push('\u6682\u65f6\u6ca1\u53d1\u73b0\u660e\u663e\u7684\u884c\u4e3a\u504f\u5dee\uff0c\u4fdd\u6301\u4eca\u5929\u7684\u8282\u594f\u5373\u53ef\u3002');
    return findings;
  }

  function catName(c) { return ({ai:'AI',en:'\u82f1\u8bed',build:'\u521b\u9020',wealth:'\u8d22\u5bcc',body:'\u8eab\u4f53',content:'\u81ea\u5a92\u4f53'})[c] || c; }

  return { generateTodayPlan, generateEnglish, genContentIdeas, wealthReview, parseExercise, bodyReport, selfAnalysis, checkSentence, THEMES };
})();

/* 英语学习模块：阅读 + 造句批改 + 词汇连连看测试 */
window.EnglishMod = (function () {

  function saveVocab(lesson) {
    S.data.vocabBank = S.data.vocabBank || [];
    (lesson.words || []).forEach(w => {
      const ex = S.data.vocabBank.find(v => v.w === w.w);
      if (ex) { ex.def = w.def; ex.last = U.todayStr(); }
      else S.data.vocabBank.push({ w: w.w, def: w.def, ex: w.ex, learned: U.todayStr(), last: U.todayStr(), wrong: 0 });
    });
    S.save();
  }

  /* 英文学习弹窗 */
  function open(lesson) {
    const wordsHtml = (lesson.words || []).map(w =>
      `<div class="item"><div class="item-main"><div class="item-title">${U.escapeHtml(w.w)} <span class="muted tiny">${U.escapeHtml(w.def)}</span></div><div class="item-sub">${U.escapeHtml(w.ex)}</div></div></div>`
    ).join('');
    const exprHtml = (lesson.expressions || []).map(e => `<li>${U.escapeHtml(e.ph)} — ${U.escapeHtml(e.zh)}</li>`).join('');
    App.openModal('🇬🇧 ' + U.escapeHtml(lesson.title), `
      <div class="field"><label>来源</label><div class="muted">${U.escapeHtml(lesson.source || '')}</div></div>
      <div class="field"><label>阅读材料</label><div class="card" style="box-shadow:none">${U.escapeHtml(lesson.excerpt || '')}</div></div>
      <div class="sec-title" style="margin:14px 0 6px"><h2>重点词汇</h2><span class="act" data-start-quiz>测一测 ✓</span></div>
      <div class="list">${wordsHtml}</div>
      <div class="sec-title" style="margin:14px 0 6px"><h2>重要表达</h2></div>
      <ul>${exprHtml}</ul>
      <div class="sec-title" style="margin:14px 0 6px"><h2>语法</h2></div>
      <div class="ai-box"><div class="ai-head">📐 语法点</div><p><b>${U.escapeHtml((lesson.grammar||{}).point||'')}</b></p><p class="muted">${U.escapeHtml((lesson.grammar||{}).ex||'')}</p></div>
      <div class="field" style="margin-top:16px"><label>我的复述 / 造句（写英文）</label><textarea id="mRep" placeholder="用英文写一两句你记住的内容…"></textarea>
        <div class="hint">写完点「检查我的句子」，AI 会帮你批改。</div></div>
      <div id="repFb"></div>
      <div class="tool-row" style="margin-top:8px">
        <button class="btn btn-sm" id="checkRep">检查我的句子</button>
        <button class="btn btn-sm btn-primary" id="startQuiz2" style="display:none">开始词汇测试</button>
      </div>
    `, () => {
      const rep = (document.getElementById('mRep').value || '').trim();
      saveVocab(lesson);
      S.add('learning', { date: U.todayStr(), topic: lesson.title, category: 'en', source: lesson.source,
        summary: (lesson.excerpt || '').slice(0, 120), notes: rep ? ('复述：' + rep) : '完成今日英语', understanding: 3, output: rep ? '英文复述' : '阅读+词汇' });
      App.closeModal(); U.toast('已记录今日英语'); App.refresh();
    }, '标记已学');

    // 绑定：检查句子
    setTimeout(() => {
      const checkBtn = document.getElementById('checkRep');
      const fb = document.getElementById('repFb');
      const quizBtn = document.getElementById('startQuiz2');
      if (checkBtn) checkBtn.onclick = () => {
        const txt = document.getElementById('mRep').value;
        const r = AI.checkSentence(txt, lesson);
        if (r.empty) { U.toast('先写点英文再检查'); return; }
        if (r.hasChinese) {
          fb.innerHTML = `<div class="ai-box"><div class="ai-head">🤖 AI 批改</div><ul>${r.pts.map(p=>`<li>${p}</li>`).join('')}</ul><p class="muted">${r.sugg[0]||''}</p></div>`;
          return;
        }
        let h = `<div class="ai-box"><div class="ai-head">🤖 AI 批改（机器检查，仅供参考）</div>
          <div class="muted tiny" style="margin:2px 0 6px">完成度 <b style="color:var(--accent-ink)">${r.score}%</b></div>`;
        if (r.pts.length) h += '<ul>' + r.pts.map(p=>`<li>${p}</li>`).join('') + '</ul>';
        if (r.sugg.length) h += '<p style="color:var(--warn);font-size:12.5px;margin-top:6px">建议：' + r.sugg.join(' ') + '</p>';
        h += '</div>';
        fb.innerHTML = h;
        if (quizBtn) quizBtn.style.display = 'inline-block';
      };
      // 绑定：从反馈区开始测试
      if (quizBtn) quizBtn.onclick = () => openQuiz(lesson.words, lesson.title);
      // 词汇区「测一测」
      const q1 = document.querySelector('[data-start-quiz]');
      if (q1) q1.onclick = () => openQuiz(lesson.words, lesson.title);
    }, 40);
  }

  /* 词汇连连看（点击配对，无需拖拽） */
  function openQuiz(words, title) {
    const pairs = (words || []).map((w, i) => ({ id: i, en: w.w, zh: w.def }));
    if (!pairs.length) { U.toast('暂无可测试的词汇'); return; }
    // 打开测试即视为在复习这些词，先并入词库（保证不依赖「标记已学」也能累积）
    S.data.vocabBank = S.data.vocabBank || [];
    pairs.forEach(p => {
      const ex = S.data.vocabBank.find(v => v.w === p.en);
      if (ex) ex.last = U.todayStr();
      else S.data.vocabBank.push({ w: p.en, def: p.zh, ex: '', learned: U.todayStr(), last: U.todayStr(), wrong: 0 });
    });
    S.save();
    const attempts = {}; pairs.forEach(p => attempts[p.id] = 0);
    let selL = null, selR = null, done = 0;
    const shuffle = a => a.slice().sort(() => Math.random() - 0.5);

    App.openModal('🇬🇧 词汇连连看 · ' + U.escapeHtml(title || '词汇'), `
      <div class="muted tiny" style="margin-bottom:8px">点击左侧英文，再点击右侧对应中文，配成一对。</div>
      <div id="quizArea" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start">
        <div id="colL"></div><div id="colR"></div>
      </div>
      <div id="quizResult"></div>
    `);

    const colL = document.getElementById('colL');
    const colR = document.getElementById('colR');
    const res = document.getElementById('quizResult');

    function item(cls, text, pid, side) {
      const d = document.createElement('div');
      d.className = 'quiz-item ' + cls;
      d.textContent = text;
      d.dataset.pid = pid; d.dataset.side = side;
      d.onclick = () => tap(pid, side, d);
      return d;
    }
    shuffle(pairs).forEach(p => colL.appendChild(item('qi-en', p.en, p.id, 'L')));
    shuffle(pairs).forEach(p => colR.appendChild(item('qi-zh', p.zh, p.id, 'R')));

    function tap(pid, side, el) {
      if (el.classList.contains('matched')) return;
      if (side === 'L') {
        if (selL && selL.el !== el) selL.el.classList.remove('sel');
        selL = { pid, el }; el.classList.add('sel');
      } else {
        if (selR && selR.el !== el) selR.el.classList.remove('sel');
        selR = { pid, el }; el.classList.add('sel');
      }
      if (selL && selR) evaluate();
    }

    function evaluate() {
      const a = selL, b = selR;
      if (a.pid === b.pid) {
        a.el.classList.remove('sel'); b.el.classList.remove('sel');
        a.el.classList.add('matched'); b.el.classList.add('matched');
        done++; selL = selR = null;
        if (done === pairs.length) finish();
      } else {
        a.el.classList.add('wrong'); b.el.classList.add('wrong');
        const pa = a.pid; attempts[pa]++; attempts[b.pid]++;
        setTimeout(() => {
          a.el.classList.remove('sel','wrong'); b.el.classList.remove('sel','wrong');
          selL = selR = null;
        }, 420);
      }
    }

    function finish() {
      const hard = Object.entries(attempts).filter(([k,v]) => v > 1).map(([k]) => pairs[k].en);
      const allRight = hard.length === 0;
      // 更新 vocabBank 错词统计
      S.data.vocabBank = S.data.vocabBank || [];
      pairs.forEach(p => {
        const v = S.data.vocabBank.find(x => x.w === p.en);
        if (v && attempts[p.id] > 1) v.wrong = (v.wrong || 0) + 1;
      });
      S.save();
      res.innerHTML = `<div class="ai-box" style="margin-top:12px">
        <div class="ai-head">${allRight ? '🎉 全部配对成功' : '✅ 完成测试'}</div>
        <p class="muted tiny">${allRight ? '这组成词汇你已经掌握了，可以放心进入下一篇。' : '容易混淆的：' + (hard.join('、') || '无') + '。建议明天再测一次这几个。'}</p>
      </div>
      <button class="btn btn-primary" id="quizAgain" style="margin-top:12px">再测一次</button>`;
      const again = document.getElementById('quizAgain');
      if (again) again.onclick = () => openQuiz(words, title);
    }
  }

  /* 测试已学词库 */
  function openBankQuiz() {
    const bank = (S.data.vocabBank || []).slice(-30);
    if (!bank.length) { U.toast('还没有学过的词汇，先去学一篇英语'); return; }
    openQuiz(bank.map(v => ({ w: v.w, def: v.def })), '已学词汇');
  }

  return { open, openQuiz, openBankQuiz };
})();

window.Pages = window.Pages || {};
window.Pages.today = (function () {
  let timers = {};

  function ring(pct, size = 64) {
    const r = size / 2 - 5, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
    return `<div class="progress-donut"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"></circle>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .4s"></circle></svg>
      <div class="pd-num">${Math.round(pct)}%</div></div>`;
  }

  function fmtTimer(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function completion(plan) {
    if (!plan || !plan.tasks || !plan.tasks.length) return 0;
    const done = plan.tasks.filter(t => t.status === 'done').length;
    return Math.round(done / plan.tasks.length * 100);
  }

  function wealthSummary() {
    const ws = S.data.wealthSnapshots.slice().sort((a,b)=>a.date.localeCompare(b.date));
    if (ws.length < 1) return { total: 0, delta: 0 };
    const last = ws[ws.length - 1], prev = ws[ws.length - 2] || last;
    return { total: last.totalAssets, delta: last.totalAssets - prev.totalAssets };

    view.querySelectorAll('[data-step-pause]').forEach(b => b.onclick = () => pauseStep(b.dataset.stepPause));
    view.querySelectorAll('[data-step-done]').forEach(b => b.onclick = () => doneStep(b.dataset.stepDone));
    view.querySelectorAll('[data-step-reopen]').forEach(b => b.onclick = () => reopenStep(b.dataset.stepReopen));
    view.querySelectorAll('[data-step-note]').forEach(b => b.onclick = () => noteStep(b.dataset.stepNote));

    // 各模块入口
    view.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
      const k = el.dataset.open;
      if (k === 'review') return openReview();
      if (k === 'learn') return App.go('learn');
      if (k === 'wealth') return App.go('wealth');
      if (k === 'body') return App.go('body');
      if (k === 'content') return App.go('content');
    });

    // 启动进行中计时器
    const plan = S.data.dailyPlans[t];
    if (plan) plan.tasks.forEach(st => { if (st.status === 'doing') runTimer(st.id); });

    App.setHeader('今日', `${U.parseDate(t).getMonth()+1}月${U.parseDate(t).getDate()}日 · ${U.weekday()}`);
  }

  function runTimer(id) {
    const el = document.querySelector(`[data-timer="${id}"]`);
    if (!el) return;
    const plan = S.data.dailyPlans[U.todayStr()];
    const st = plan.tasks.find(x => x.id === id);
    if (!st) return;
    timers[id] = setInterval(() => {
      const elapsed = st.actual + Math.floor((Date.now() - st._start) / 1000);
      el.textContent = '已用 ' + fmtTimer(elapsed);
    }, 1000);
  }

  function startStep(id) {
    const plan = S.data.dailyPlans[U.todayStr()];
    const st = plan.tasks.find(x => x.id === id); if (!st) return;
    st.status = 'doing'; st._start = Date.now(); S.save();
    App.refresh();
  }
  function pauseStep(id) {
    const plan = S.data.dailyPlans[U.todayStr()];
    const st = plan.tasks.find(x => x.id === id); if (!st) return;
    st.actual += Math.floor((Date.now() - st._start) / 1000); st.status = 'todo'; S.save();
    clearTimers(); App.refresh();
  }
  function doneStep(id) {
    const plan = S.data.dailyPlans[U.todayStr()];
    const st = plan.tasks.find(x => x.id === id); if (!st) return;
    if (st.status === 'doing') st.actual += Math.floor((Date.now() - st._start) / 1000);
    st.status = 'done'; S.save(); clearTimers(); App.refresh();
  }
  function reopenStep(id) {
    const plan = S.data.dailyPlans[U.todayStr()];
    const st = plan.tasks.find(x => x.id === id); if (!st) return;
    st.status = 'todo'; S.save(); App.refresh();
  }
  function noteStep(id) {
    const plan = S.data.dailyPlans[U.todayStr()];
    const st = plan.tasks.find(x => x.id === id); if (!st) return;
    App.openModal(`步骤笔记`, `
      <div class="field"><label>笔记</label><textarea id="mNote" placeholder="这一步的想法、参考、产出…">${U.escapeHtml(st.note||'')}</textarea></div>
    `, () => {
      st.note = document.getElementById('mNote').value; S.save(); App.closeModal(); U.toast('已保存');
    });
  }

  function editMain() {
    const plan = S.data.dailyPlans[U.todayStr()];
    App.openModal('编辑今日主线', `
      <div class="field"><label>今日主题</label><input id="mTheme" value="${U.escapeHtml(plan.theme)}"></div>
      <div class="field"><label>为什么今天值得学</label><textarea id="mWhy">${U.escapeHtml(plan.whyToday||'')}</textarea></div>
      <div class="field"><label>与我有什么关系</label><textarea id="mRel">${U.escapeHtml(plan.relatedToMe||'')}</textarea></div>
      <div class="field"><label>今日最终产出</label><input id="mOut" value="${U.escapeHtml(plan.finalOutput||'')}"></div>
      <div class="field"><label>预估时间（分钟）</label><input id="mTime" type="number" value="${plan.estimatedTime||180}"></div>
    `, () => {
      plan.theme = document.getElementById('mTheme').value.trim() || plan.theme;
      plan.whyToday = document.getElementById('mWhy').value.trim();
      plan.relatedToMe = document.getElementById('mRel').value.trim();
      plan.finalOutput = document.getElementById('mOut').value.trim() || plan.finalOutput;
      plan.estimatedTime = parseInt(document.getElementById('mTime').value) || plan.estimatedTime;
      S.save(); App.closeModal(); App.refresh(); U.toast('已更新主线');
    });
  }

  function openEnglish() {
    EnglishMod.open(AI.generateEnglish(false));
  }

  function openReview() {
    const t = U.todayStr();
    const existing = S.data.reviews.find(r => r.date === t);
    App.openModal('🌙 今日复盘', `
      <div class="field"><label>今天学了什么</label><textarea id="rLearn" placeholder="一个概念 / 一篇文章…">${existing?U.escapeHtml(existing.whatLearned):''}</textarea></div>
      <div class="field"><label>今天完成了什么</label><textarea id="rDone" placeholder="一件具体的事">${existing?U.escapeHtml(existing.whatCompleted):''}</textarea></div>
      <div class="field"><label>今天产出了什么</label><textarea id="rOut" placeholder="一份文档 / 一张图 / 一段代码…">${existing?U.escapeHtml(existing.whatProduced):''}</textarea></div>
      <div class="field"><label>哪里可以更好</label><textarea id="rImp" placeholder="一个真实可改的点">${existing?U.escapeHtml(existing.whatToImprove):''}</textarea></div>
      <div class="field"><label>明天计划</label><textarea id="rPlan" placeholder="明天最重要的一件事">${existing?U.escapeHtml(existing.tomorrowPlan):''}</textarea></div>
    `, () => {
      const rec = { date: t, whatLearned: v('rLearn'), whatCompleted: v('rDone'), whatProduced: v('rOut'), whatToImprove: v('rImp'), tomorrowPlan: v('rPlan') };
      if (existing) S.update('reviews', existing.id, rec); else S.add('reviews', rec);
      App.closeModal(); U.toast('复盘已保存'); App.refresh();
    }, existing ? '更新复盘' : '保存复盘');
    function v(id){ return document.getElementById(id).value.trim(); }
  }

  return { render, bind };
})();

  /* ---- 学习历史 ---- */
  function historyView() {
    const all = S.data.learning.slice().sort((a,b)=>b.date.localeCompare(a.date));
    if (!all.length) return '<div class="card"><div class="empty"><div class="e-ico">🧠</div><div class="e-sub">还没有学习记录</div></div></div>';
    let html = '', lastDate = '';
    all.forEach(r => {
      if (r.date !== lastDate) { html += `<div class="sec-title" style="margin:16px 4px 8px"><h2>${U.fmtDateCN(r.date)}</h2></div>`; lastDate = r.date; }
      const tagCls = {ai:'ai',en:'en',build:'build',wealth:'wealth',body:'body',content:'content'}[r.category] || '';
      const tagTxt = {ai:'AI',en:'英语',build:'创造',wealth:'财富',body:'身体',content:'自媒体'}[r.category] || r.category;
      html += `<div class="card" style="box-shadow:var(--shadow-soft);margin-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="item-title">${U.escapeHtml(r.topic)}</div><span class="tag ${tagCls}">${tagTxt}</span></div>
        <div class="muted tiny" style="margin-top:4px">${U.escapeHtml((r.summary||'').slice(0,80))}</div>
        ${r.output?`<div class="muted tiny" style="margin-top:6px">产出：<b style="color:var(--text)">${U.escapeHtml(r.output)}</b></div>`:''}
        <div class="muted tiny" style="margin-top:4px">理解 ${r.understanding||'-'}/5</div>
      </div>`;
    });
    return html;
  }

  function bind() {
    const view = document.getElementById('view');
    view.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { sub = b.dataset.sub; App.refresh(); });
    const genBtn = view.querySelector('[data-gen-ai]'); if (genBtn) genBtn.onclick = genAiTask;
    const openEn = view.querySelector('[data-open-en]'); if (openEn) openEn.onclick = () => EnglishMod.open(AI.generateEnglish(false));
    const regenEn = view.querySelector('[data-regen-en]'); if (regenEn) regenEn.onclick = () => { AI.generateEnglish(true); App.refresh(); U.toast('已换一篇'); };
    const testEn = view.querySelector('[data-test-en]'); if (testEn) testEn.onclick = () => EnglishMod.openQuiz(AI.generateEnglish(false).words, AI.generateEnglish(false).title);
    const testBank = view.querySelector('[data-test-bank]'); if (testBank) testBank.onclick = () => EnglishMod.openBankQuiz();
    view.querySelectorAll('[data-proj]').forEach(c => c.onclick = () => openProj(c.dataset.proj));
    const addP = view.querySelector('[data-add-proj]'); if (addP) addP.onclick = addProj;
    App.setHeader('学习', '信息 → 学习 → 行动 → 产出');
  }

  return { render, bind };
})();
