/* 财富模块 */
window.Pages = window.Pages || {};
window.Pages.wealth = (function () {
  let sub = 'overview';
  let period = 'all';

  function fx() { return S.data.settings.fx; }
  function cny(a) { return (a.quantity || 0) * (a.currentPrice || 0) * (fx()[a.currency] || 1); }
  function totals() {
    let total = 0, invest = 0, cash = 0;
    S.data.assets.forEach(a => {
      const v = cny(a); total += v;
      if (['美股ETF','美股个股','黄金'].includes(a.category)) invest += v;
      else cash += v;
    });
    return { total, invest, cash };
  }

  function snapStats() {
    const ws = S.data.wealthSnapshots.slice().sort((a,b)=>a.date.localeCompare(b.date));
    if (!ws.length) return null;
    const last = ws[ws.length-1];
    const monthStart = ws.find(s => s.date.startsWith(last.date.slice(0,7))) || ws[0];
    const yearStart = ws.find(s => s.date.startsWith(last.date.slice(0,4)+'-01')) || ws[0];
    return {
      last, total: last.totalAssets,
      today: last.totalAssets - (ws[ws.length-2]?.totalAssets || last.totalAssets),
      month: last.totalAssets - monthStart.totalAssets,
      year: last.totalAssets - yearStart.totalAssets,
      first: ws[0].totalAssets,
      all: last.totalAssets - ws[0].totalAssets
    };
  }

  function render() {
    const seg = `<div class="seg" style="margin-bottom:6px">
      <button class="${sub==='overview'?'active':''}" data-wsub="overview">总览</button>
      <button class="${sub==='alloc'?'active':''}" data-wsub="alloc">配置</button>
      <button class="${sub==='tx'?'active':''}" data-wsub="tx">记录</button>
      <button class="${sub==='curve'?'active':''}" data-wsub="curve">曲线</button>
      <button class="${sub==='review'?'active':''}" data-wsub="review">复盘</button>
    </div>`;
    let body = '';
    if (sub==='overview') body = overviewView();
    else if (sub==='alloc') body = allocView();
    else if (sub==='tx') body = txView();
    else if (sub==='curve') body = curveView();
    else body = reviewView();
    return seg + body;
  }

  /* ---- 总览 ---- */
  function overviewView() {
    const T = totals(); const st = snapStats();
    const donut = Charts.donut(S.data.assets.map(a => ({ label:a.name, value:cny(a), color: colorOf(a) })), { center: U.money(T.total), centerSub:'总资产', size:170 });
    const delta = st ? st.today : 0;
    const cards = `
    <div class="card">
      <div class="muted tiny">总资产（人民币）</div>
      <div style="font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:2px">${U.moneyExact(T.total)}</div>
      <div class="pill ${delta>=0?'up':'down'}" style="margin-top:6px">${U.pct(delta/T.total*100)} 较上次记录</div>
    </div>
    <div class="stat-grid" style="margin-top:12px">
      <div class="stat"><div class="s-val">${U.money(T.invest)}</div><div class="s-lbl">投资市值</div></div>
      <div class="stat"><div class="s-val">${U.money(T.cash)}</div><div class="s-lbl">现金类资产</div></div>
      <div class="stat"><div class="s-val ${st&&st.month>=0?'':''}">${st?U.pct(st.month/st.first*100):'—'}</div><div class="s-lbl">本月变化</div></div>
      <div class="stat"><div class="s-val">${st?U.pct(st.year/st.first*100):'—'}</div><div class="s-lbl">年度变化</div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-head"><h3>资产构成</h3></div>
      <div class="chart-wrap">${donut}</div>
    </div>`;
    return cards;
  }

  /* ---- 配置 ---- */
  function allocView() {
    const T = totals();
    const rows = S.data.assets.map(a => {
      const v = cny(a); const cur = T.total? v/T.total*100 : 0;
      const tgt = a.targetAllocation || 0;
      const diff = cur - tgt;
      const status = Math.abs(diff) < 1.5 ? 'ok' : (diff > 0 ? 'over' : 'under');
      const statusTxt = status==='ok'?'合理':(status==='over'?'超配':'低配');
      return `<div class="alloc-row">
        <div class="alloc-name">${U.escapeHtml(a.name)}</div>
        <div class="alloc-bar"><div class="fill" style="width:${Math.min(100,cur)}%;background:${colorOf(a)}"></div><div class="target" style="left:${Math.min(100,tgt)}%"></div></div>
        <div class="alloc-pct">${cur.toFixed(1)}%</div>
        <div class="alloc-status ${status}">${statusTxt}</div>
        <span class="item-arrow" data-edit-asset="${a.id}" style="cursor:pointer">✎</span>
      </div>`;
    }).join('');
    const donutCur = Charts.donut(S.data.assets.map(a => ({label:a.name,value:cny(a),color:colorOf(a)})), {size:160, center:U.money(T.total), centerSub:'当前'});
    const donutTgt = Charts.donut(S.data.assets.map(a => ({label:a.name,value:(a.targetAllocation||0),color:colorOf(a)})), {size:160, center:'目标', centerSub:'配置'});
    return `
    <div class="tool-row" style="margin-bottom:6px">
      <button class="btn btn-primary" data-add-asset>＋ 添加资产</button>
      <button class="btn" data-edit-fx>汇率设置</button>
    </div>
    <div class="card">
      <div class="card-head"><h3>当前 vs 目标</h3><span class="sub">竖线=目标位</span></div>
      <div class="mini-row">
        <div class="mini" style="text-align:center"><div class="chart-wrap">${donutCur}</div></div>
        <div class="mini" style="text-align:center"><div class="chart-wrap">${donutTgt}</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px"><div class="list" style="padding-top:4px">${rows}</div>
      <div class="muted tiny" style="margin-top:10px">提示：超配/低配仅作参考，再平衡请结合自身长期逻辑。</div>
    </div>`;
  }

  /* ---- 交易记录 ---- */
  function txView() {
    const txs = S.data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));
    const html = txs.map(t => `
      <div class="item" data-tx="${t.id}">
        <div class="item-ico">${typeIco(t.type)}</div>
        <div class="item-main">
          <div class="item-title">${U.escapeHtml(t.asset)} · ${U.escapeHtml(t.type)}</div>
          <div class="item-sub">${U.fmtDateCN(t.date)} · ${U.money(t.amount)} · ${U.escapeHtml((t.reason||'').slice(0,24))}${(t.reason||'').length>24?'…':''}</div>
        </div>
        <span class="tag ${t.decisionType==='情绪驱动'?'content':''}">${U.escapeHtml(t.decisionType||'')}</span>
      </div>`).join('') || '<div class="card"><div class="empty"><div class="e-ico">💰</div><div class="e-sub">还没有交易记录</div></div></div>';
    return `
    <div class="tool-row" style="margin-bottom:6px"><button class="btn btn-primary" data-add-tx>＋ 记录一笔操作</button></div>
    <div class="card" style="padding-top:6px"><div class="list">${html}</div></div>
    <div class="notice">每一笔重要操作，都记下「我为什么做这个操作」与「如果我错了，可能错在哪」。</div>`;
  }

  function typeIco(t){ return ({买入:'🟢',卖出:'🔴',分红:'💵',入金:'⬆️',出金:'⬇️',换汇:'💱'})[t]||'•'; }

  /* ---- 增长曲线 ---- */
  function curveView() {
    const ws = S.data.wealthSnapshots.slice().sort((a,b)=>a.date.localeCompare(b.date));
    let data = ws;
    if (period==='year') data = ws.slice(-12);
    if (period==='quarter') data = ws.slice(-3);
    const labels = data.map(s => U.fmtMonth(s.date));
    const series = [
      { name:'总资产', color:'var(--accent)', values: data.map(s=>s.totalAssets) },
      { name:'投资市值', color:'var(--gold)', values: data.map(s=>s.investmentValue) }
    ];
    const line = Charts.line(series, labels, { height:180, area:true, yfmt:v=>U.money(v) });
    const st = snapStats();
    const comp = st ? [
      {l:'主动储蓄', v:st.last.savingsContribution, c:'var(--up)'},
      {l:'投资收益', v:st.last.investmentReturn, c:'var(--gold)'},
      {l:'分红', v:st.last.dividendIncome, c:'var(--c-en)'},
      {l:'汇率影响', v:st.last.fxImpact, c:'var(--c-build)'}
    ] : [];
    const compBar = Charts.bar(comp.map(c=>({label:c.l, value:Math.abs(c.v), color:c.c})), { height:150, vfmt:v=>U.money(v) });
    return `
    <div class="seg" style="margin-bottom:10px">
      <button class="${period==='all'?'active':''}" data-per="all">全部</button>
      <button class="${period==='year'?'active':''}" data-per="year">近一年</button>
      <button class="${period==='quarter'?'active':''}" data-per="quarter">近三月</button>
    </div>
    <div class="card">
      <div class="card-head"><h3>财富增长曲线</h3><span class="sub">总资产 vs 投资市值</span></div>
      <div class="chart-wrap">${line}</div>
      <div class="legend"><span class="lg"><span class="dot" style="background:var(--accent)"></span>总资产</span><span class="lg"><span class="dot" style="background:var(--gold)"></span>投资市值</span></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-head"><h3>最新一期增长来源</h3><span class="sub">区分储蓄与收益</span></div>
      <div class="chart-wrap">${compBar}</div>
      <div class="muted tiny" style="margin-top:8px">资产增长 ≠ 投资收益。把「我存了多少」和「钱生了多少」分开看。</div>
    </div>`;
  }

  /* ---- 决策复盘 ---- */
  function reviewView() {
    const insights = AI.wealthReview();
    const insHtml = insights.map(i => `<li>${U.escapeHtml(i)}</li>`).join('');
    const txs = S.data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
    const txHtml = txs.map(t => `
      <div class="card" style="box-shadow:var(--shadow-soft);margin-top:10px">
        <div style="display:flex;justify-content:space-between"><div class="item-title">${U.escapeHtml(t.asset)} · ${U.escapeHtml(t.type)}</div><span class="muted tiny">${U.fmtDateCN(t.date)}</span></div>
        <div class="muted tiny" style="margin-top:4px"><b style="color:var(--text)">为什么：</b>${U.escapeHtml(t.reason||'—')}</div>
        <div class="muted tiny" style="margin-top:4px"><b style="color:var(--text)">风险：</b>${U.escapeHtml(t.risk||'—')}</div>
        ${t.outcome?`<div class="muted tiny" style="margin-top:4px"><b style="color:var(--text)">结果复盘：</b>${U.escapeHtml(t.outcome)}</div>`:''}
        ${!t.outcome?`<button class="btn btn-sm" style="margin-top:8px" data-tx-outcome="${t.id}">补充结果复盘</button>`:''}
      </div>`).join('') || '<div class="card"><div class="empty"><div class="e-ico">🪞</div><div class="e-sub">先记录交易，才能复盘</div></div></div>';
    return `
    <div class="ai-box">
      <div class="ai-head">🤖 基于你的历史行为分析</div>
      <ul>${insHtml}</ul>
    </div>
    <div class="sec-title"><h2>逐笔回顾</h2></div>
    ${txHtml}
    <div class="notice">这是投资记录与分析工具，帮助你理解自己的决策，而非给出确定性买卖建议。</div>`;
  }

  /* ---- 编辑/添加资产 ---- */
  function assetModal(id) {
    const a = id ? S.data.assets.find(x=>x.id===id) : null;
    App.openModal(a ? '编辑资产' : '添加资产', `
      <div class="field"><label>名称</label><input id="aName" value="${a?U.escapeHtml(a.name):''}" placeholder="如 QQQ"></div>
      <div class="field"><label>类别</label>
        <select id="aCat">
          ${['美股ETF','美股个股','黄金','美元货基','其他'].map(c=>`<option ${a&&a.category===c?'selected':''}>${c}</option>`).join('')}
        </select></div>
      <div class="field"><label>币种</label>
        <select id="aCur">${['USD','CNY','HKD','JPY'].map(c=>`<option ${a&&a.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>数量</label><input id="aQty" type="number" value="${a?a.quantity:0}"></div>
      <div class="field"><label>现价（该币种）</label><input id="aPrice" type="number" value="${a?a.currentPrice:0}"></div>
      <div class="field"><label>目标配置 %</label><input id="aTgt" type="number" value="${a?(a.targetAllocation||0):0}"></div>
    `, () => {
      const rec = { name:val('aName')||'未命名', category:val('aCat'), currency:val('aCur'),
        quantity:parseFloat(val('aQty'))||0, currentPrice:parseFloat(val('aPrice'))||0, targetAllocation:parseFloat(val('aTgt'))||0 };
      if (a) S.update('assets', id, rec); else S.add('assets', rec);
      App.closeModal(); U.toast('已保存'); App.refresh();
    }, a?'保存':'添加');
    function val(id){ return document.getElementById(id).value.trim(); }
  }

  function fxModal() {
    const fxr = fx();
    App.openModal('汇率设置（1 外币 = ? 人民币）', `
      <div class="field"><label>美元 USD</label><input id="fxUSD" type="number" step="0.01" value="${fxr.USD}"></div>
      <div class="field"><label>港币 HKD</label><input id="fxHKD" type="number" step="0.01" value="${fxr.HKD}"></div>
      <div class="field"><label>日元 JPY</label><input id="fxJPY" type="number" step="0.01" value="${fxr.JPY}"></div>
      <div class="muted tiny">默认展示人民币总资产，修改汇率后所有外币资产会自动换算。</div>
    `, () => {
      S.data.settings.fx = { USD:parseFloat(val('fxUSD'))||7.2, HKD:parseFloat(val('fxHKD'))||0.92, JPY:parseFloat(val('fxJPY'))||0.048 };
      S.save(); App.closeModal(); U.toast('汇率已更新'); App.refresh();
    }, '保存');
    function val(id){ return document.getElementById(id).value.trim(); }
  }

  /* ---- 添加交易 ---- */
  function txModal() {
    const assets = S.data.assets.map(a=>`<option>${U.escapeHtml(a.name)}</option>`).join('');
    const types = ['买入','卖出','分红','入金','出金','换汇'];
    const decisions = ['长期配置','资产再平衡','下跌补仓','估值判断','短期交易','情绪驱动','其他'];
    App.openModal('＋ 记录一笔操作', `
      <div class="field"><label>日期</label><input id="tDate" type="date" value="${U.todayStr()}"></div>
      <div class="field"><label>资产</label><select id="tAsset">${assets||'<option>现金</option>'}</select></div>
      <div class="field"><label>操作类型</label><select id="tType">${types.map(t=>`<option ${t==='买入'?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>数量</label><input id="tQty" type="number" value="0" oninput="calcAmt()"></div>
      <div class="field"><label>价格</label><input id="tPrice" type="number" value="0" oninput="calcAmt()"></div>
      <div class="field"><label>手续费</label><input id="tFee" type="number" value="0"></div>
      <div class="field"><label>金额（自动计算，人民币）</label><input id="tAmt" type="number" readonly style="background:var(--surface-soft)"></div>
      <div class="field"><label>决策类型</label><select id="tDec">${decisions.map(d=>`<option ${d==='长期配置'?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label>我为什么做这个操作？<span style="color:var(--down)">*</span></label><textarea id="tWhy" placeholder="例如：市场下跌，我认为长期科技仍有增长潜力，因此补仓。"></textarea></div>
      <div class="field"><label>如果我错了，可能错在哪？</label><textarea id="tRisk" placeholder="例如：若衰退超预期，短期可能继续下跌。"></textarea></div>
    `, () => {
      const why = document.getElementById('tWhy').value.trim();
      if (!why) { U.toast('请填写「为什么做这个操作」'); return; }
      const qty=parseFloat(val('tQty'))||0, price=parseFloat(val('tPrice'))||0, fee=parseFloat(val('tFee'))||0;
      const assetName = document.getElementById('tAsset').value;
      const asset = S.data.assets.find(a=>a.name===assetName);
      const rate = asset ? (fx()[asset.currency]||1) : 1;
      const amount = Math.round((qty*price)*rate + fee*rate);
      S.add('transactions', { date:val('tDate'), asset:assetName, type:val('tType'), quantity:qty, price,
        fee, exchangeRate:rate, amount, reason:why, decisionType:val('tDec'), risk:val('tRisk') });
      App.closeModal(); U.toast('已记录'); App.refresh();
    }, '保存');
    function val(id){ return document.getElementById(id).value.trim(); }
    setTimeout(()=>{ const a=document.getElementById('tAmt'); if(a){ window.calcAmt=()=>{ const q=parseFloat(document.getElementById('tQty').value)||0,p=parseFloat(document.getElementById('tPrice').value)||0;a.value=Math.round(q*p); }; window.calcAmt(); } },20);
  }

  function txOutcome(id) {
    const t = S.data.transactions.find(x=>x.id===id); if(!t) return;
    App.openModal('补充结果复盘', `
      <div class="field"><label>后来发生了什么 / 结果如何</label><textarea id="oRes" placeholder="价格变化、我的感受、是否按计划">${U.escapeHtml(t.outcome||'')}</textarea></div>
      <div class="field"><label>当时的逻辑是否正确？</label><select id="oOk"><option value="1">基本正确</option><option value="0">部分偏差</option><option value="-1">判断错误</option></select></div>
      <div class="field"><label>下次怎么做</label><textarea id="oNext" placeholder="一个可执行的调整"></textarea></div>
    `, () => {
      S.update('transactions', id, { outcome: val('oRes'), logicOk: parseInt(val('oOk')), nextAdjust: val('oNext') });
      App.closeModal(); U.toast('已补充'); App.refresh();
    }, '保存');
    function val(id){ return document.getElementById(id).value.trim(); }
  }

  function colorOf(a) {
    const m = { '美股ETF':'#5b6cf0', '美股个股':'#7c5cff', '黄金':'#c9962b', '美元货基':'#2b8a9b', '其他':'#9a9aa0' };
    return m[a.category] || '#5b6cf0';
  }

  function bind() {
    const view = document.getElementById('view');
    view.querySelectorAll('[data-wsub]').forEach(b => b.onclick = () => { sub = b.dataset.wsub; App.refresh(); });
    view.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { period = b.dataset.per; App.refresh(); });
    const addA = view.querySelector('[data-add-asset]'); if (addA) addA.onclick = () => assetModal(null);
    const editFx = view.querySelector('[data-edit-fx]'); if (editFx) editFx.onclick = fxModal;
    view.querySelectorAll('[data-edit-asset]').forEach(b => b.onclick = (e)=>{ e.stopPropagation(); assetModal(b.dataset.editAsset); });
    const addT = view.querySelector('[data-add-tx]'); if (addT) addT.onclick = txModal;
    view.querySelectorAll('[data-tx-outcome]').forEach(b => b.onclick = () => txOutcome(b.dataset.txOutcome));
    App.setHeader('财富', '资产实验室 · 区分增长与收益');
  }

  return { render, bind };
})();


/* === assets/js/pages/body.js === */
/* 身体与运动模块 */
window.Pages = window.Pages || {};
window.Pages.body = (function () {

  function streak() {
    const dates = new Set(S.data.exercises.map(e => e.date));
    let d = U.todayStr();
    if (!dates.has(d)) d = U.addDays(d, -1);
    let s = 0;
    while (dates.has(d)) { s++; d = U.addDays(d, -1); }
    return s;
  }

  function monthStats() {
    const t = U.todayStr(), month = t.slice(0,7);
    const ex = S.data.exercises.filter(e => e.date.startsWith(month));
    const days = new Set(ex.map(e => e.date)).size;
    const totalMin = ex.reduce((a,e)=>a+(e.duration||0),0);
    const wSorted = S.data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));
    const cur = wSorted.length ? wSorted[wSorted.length-1] : null;
    const monthStartW = wSorted.find(w => w.date.startsWith(month));
    const diff = (cur && monthStartW) ? (cur.weight - monthStartW.weight) : null;
    return { days, totalDays: new Date(t.slice(0,4), t.slice(5,7), 0).getDate(), totalMin, cur, diff };
  }

  function render() {
    const ms = monthStats();
    const w = S.data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);
    const wLine = w.length>1 ? Charts.line([{name:'体重',color:'var(--c-body)',values:w.map(x=>x.weight)}], w.map(x=>U.fmtDateCN(x.date)), {height:150, yfmt:v=>v.toFixed(1)}) : '<div class="empty"><div class="e-sub">记录体重后显示趋势</div></div>';
    const last7 = w.slice(-7).map(x=>x.weight);
    const avg7 = last7.length ? U.avg(last7).toFixed(1) : '—';
    const vals = w.map(x=>x.weight);
    const range = vals.length ? (Math.max(...vals)-Math.min(...vals)).toFixed(1) : '—';

    const exRecents = S.data.exercises.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
    const exHtml = exRecents.length ? exRecents.map(e => `<div class="item">
      <div class="item-ico">${typeIco(e.type)}</div>
      <div class="item-main"><div class="item-title">${U.escapeHtml(e.type)} · ${e.duration}分钟</div>
      <div class="item-sub">${U.fmtDateCN(e.date)} · ${U.escapeHtml((e.bodyParts||[]).join('/'))} · ${U.escapeHtml(e.intensity)}</div></div>
      <span class="muted tiny">${U.escapeHtml(e.feeling||'')}</span></div>`).join('') : '<div class="empty"><div class="e-ico">🏃</div><div class="e-sub">还没有运动记录</div></div>';

    const rep = AI.bodyReport();
    const repHtml = rep.suggestions.map(s => `<li>${U.escapeHtml(s)}</li>`).join('');

    return `
    <!-- 状态 -->
    <div class="card">
      <div class="card-head"><h3>🏃 本月身体状态</h3><span class="sub">${rep.month}月</span></div>
      <div class="stat-grid">
        <div class="stat"><div class="s-val">${ms.days}<span style="font-size:14px;color:var(--text-2)">/${ms.totalDays}</span></div><div class="s-lbl">本月运动天数</div></div>
        <div class="stat"><div class="s-val">${streak()}</div><div class="s-lbl">连续运动天数</div></div>
        <div class="stat"><div class="s-val">${ms.totalMin}<span style="font-size:13px;color:var(--text-2)">分</span></div><div class="s-lbl">总运动时长</div></div>
        <div class="stat"><div class="s-val">${ms.cur?ms.cur.weight+'kg':'—'}</div><div class="s-lbl">当前体重</div></div>
      </div>
      ${ms.diff!=null?`<div class="muted tiny" style="margin-top:10px">较月初：<b style="color:${ms.diff<=0?'var(--up)':'var(--down)'}">${ms.diff>=0?'+':''}${ms.diff}kg</b> · 7日均值 ${avg7}kg · 30日波动 ${range}kg</div>`:''}
    </div>

    <!-- 体重趋势 -->

      <div class="muted tiny" style="margin-top:8px">7日均值 ${avg7}kg · 波动范围 ${range}kg。单日变化多受水分、睡眠、生理周期影响。</div>

    <!-- 运动记录 -->

    <!-- 月度报告 -->
    <div class="sec-title"><h2>本月身体状态报告</h2></div>
    <div class="ai-box">
      <div class="ai-head">🤖 ${rep.month}月 AI 分析（基于你的真实记录）</div>
      <ul>${repHtml}</ul>
    </div>`;
  }

  function typeIco(t){ return ({'有氧':'🏃','Pilates / 瑜伽':'🧘','力量训练':'🏋️','臀腿':'🍑','腰腹':'💪','上肢':'💪','背部':'🔙','步行':'🚶','游泳':'🏊','其他':'⭐'})[t]||'⭐'; }

  function recExercise() {
    App.openModal('记录今天运动', `
      <div class="field"><label>用一句话记录（AI 自动解析）</label><textarea id="exNL" placeholder="例如：今天做了 45 分钟臀桥和卷腹，主要练臀和腰腹，强度中等。"></textarea>
        <div class="hint">也支持分步手动填写 ↓</div></div>
      <div id="exPreview" class="card" style="box-shadow:none;display:none"></div>
      <div class="field" style="margin-top:10px"><label>运动类型</label>
        <select id="exType">${['有氧','Pilates / 瑜伽','力量训练','臀腿','腰腹','上肢','背部','步行','游泳','其他'].map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="field"><label>时长（分钟）</label><input id="exDur" type="number" value="30"></div>
      <div class="field"><label>强度</label><select id="exInt"><option>低</option><option selected>中</option><option>高</option></select></div>
      <div class="field"><label>训练部位（逗号分隔）</label><input id="exParts" placeholder="臀,腰腹"></div>
      <div class="field"><label>运动感受</label><input id="exFeel" placeholder="轻松 / 累但爽 / 疲劳"></div>
    `, () => {
      const rec = { date: U.todayStr(), type: val('exType'), duration: parseInt(val('exDur'))||30,
        intensity: val('exInt'), bodyParts: val('exParts').split(/[,，]/).map(s=>s.trim()).filter(Boolean), feeling: val('exFeel'), notes: '' };
      S.add('exercises', rec); App.closeModal(); U.toast('已记录运动'); App.refresh();
    }, '保存');
    function val(id){ return document.getElementById(id).value.trim(); }
    setTimeout(() => {
      const nl = document.getElementById('exNL'), pv = document.getElementById('exPreview');
      if (!nl) return;
      nl.addEventListener('input', () => {
        const txt = nl.value.trim(); if (!txt) { pv.style.display='none'; return; }
        const p = AI.parseExercise(txt);
        pv.style.display='block';
        pv.innerHTML = `<div class="muted tiny" style="font-weight:700">AI 解析结果（可手动调整）：</div>
          <div class="muted tiny" style="margin-top:4px">类型 <b style="color:var(--text)">${p.type}</b> · ${p.duration}分钟 · ${p.intensity} · 部位 ${p.bodyParts.join('/')} · ${p.feeling}</div>`;
        // 自动填充到表单
        document.getElementById('exType').value = p.type;
        document.getElementById('exDur').value = p.duration;
        document.getElementById('exInt').value = p.intensity;
        document.getElementById('exParts').value = p.bodyParts.join(',');
        document.getElementById('exFeel').value = p.feeling;
      });
    }, 30);
  }

  function recWeight() {
    const last = S.data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).pop() || {};
    App.openModal('记录体重 / 身体', `
      <div class="field"><label>日期</label><input id="wDate" type="date" value="${U.todayStr()}"></div>
      <div class="field"><label>体重 (kg)</label><input id="wW" type="number" step="0.1" value="${last.weight||''}" placeholder="如 51.6"></div>
      <div class="mini-row">
        <div class="field"><label>腰围</label><input id="wWaist" type="number" step="0.1" value="${last.waist||''}"></div>
        <div class="field"><label>臀围</label><input id="wHip" type="number" step="0.1" value="${last.hip||''}"></div>
      </div>
      <div class="mini-row">
        <div class="field"><label>大腿围</label><input id="wThigh" type="number" step="0.1" value="${last.thigh||''}"></div>
        <div class="field"><label>体脂率%</label><input id="wFat" type="number" step="0.1" value="${last.bodyFat||''}"></div>
      </div>
      <div class="field"><label>睡眠（小时）</label><input id="wSleep" type="number" step="0.5" value="${last.sleep||7}"></div>
      <div class="field"><label>身体状态</label>
        <select id="wState">${['正常','水肿','疲劳','肌肉酸痛','生病','睡眠不足','经期','其他'].map(s=>`<option ${last.bodyState===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>饮食 / 备注</label><textarea id="wNote" placeholder="如：昨晚高盐，今天略水肿"></textarea></div>
    `, () => {
      const w = parseFloat(val('wW')); if (!w) { U.toast('请填写体重'); return; }
      S.add('weights', { date:val('wDate'), weight:w, waist:parseFloat(val('wWaist'))||null, hip:parseFloat(val('wHip'))||null,
        thigh:parseFloat(val('wThigh'))||null, bodyFat:parseFloat(val('wFat'))||null, sleep:parseFloat(val('wSleep'))||null,
        bodyState:val('wState'), notes:val('wNote') });
      App.closeModal(); U.toast('已记录'); App.refresh();
    }, '保存');
    function val(id){ return document.getElementById(id).value.trim(); }
  }

  function bind() {
    const view = document.getElementById('view');
    const re = view.querySelector('[data-rec-ex]'); if (re) re.onclick = recExercise;
    const rw = view.querySelector('[data-rec-wt]'); if (rw) rw.onclick = recWeight;
    App.setHeader('身体', '记录习惯 · 看长期趋势');
  }

  return { render, bind };
})();


/* === assets/js/pages/content.js === */
/* 自媒体模块 */
window.Pages = window.Pages || {};
window.Pages.content = (function () {
  let sub = 'idea';

  function render() {
    const seg = `<div class="seg" style="margin-bottom:6px">
      <button class="${sub==='idea'?'active':''}" data-csub="idea">内容机会</button>
      <button class="${sub==='data'?'active':''}" data-csub="data">内容数据</button>
      <button class="${sub==='analysis'?'active':''}" data-csub="analysis">数据分析</button>
    </div>`;
    let body = '';
    if (sub==='idea') body = ideaView();
    else if (sub==='data') body = dataView();
    else body = analysisView();
    return seg + body;
  }

  /* ---- 内容机会 ---- */
  function ideaView() {
    const ideas = AI.genContentIdeas(3);
    const cards = ideas.map((id, i) => `
      <div class="card" style="border-left:3px solid var(--c-content)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="tag content">机会 ${i+1}</span>
          <span class="muted tiny">${U.escapeHtml(id.hot)}</span>
        </div>
        <div class="item-title" style="margin-top:8px">🔥 ${U.escapeHtml(id.hot)}</div>
        <div class="muted tiny" style="margin-top:4px"><b style="color:var(--text)">为什么火：</b>${U.escapeHtml(id.whyHot)}</div>
        <div class="muted tiny" style="margin-top:4px"><b style="color:var(--text)">我的真实角度：</b>${U.escapeHtml(id.angle)}</div>
        <div class="muted tiny" style="margin-top:4px"><b style="color:var(--text)">推荐标题：</b>${U.escapeHtml(id.titles[0])}</div>
        <div class="muted tiny" style="margin-top:4px"><b style="color:var(--text)">结构：</b>${id.structure.join(' → ')}</div>
        <button class="btn btn-sm btn-primary" style="margin-top:10px" data-use-idea="${i}">用这个选题创作</button>
      </div>`).join('');
    return `
    <div class="card">
      <div class="card-head"><h3>📱 今日内容机会</h3></div>
      <p class="muted tiny" style="margin-top:-4px">公式：热点 + 我的真实经历 + 我的观点 = 我的内容。基于你的定位自动生成。</p>
    </div>
    ${cards}
    <div class="notice">不复制热门，用「真实问题 → 我的选择 → 实际行动 → 结果 → 复盘」产出内容。</div>`;
  }

  /* ---- 内容数据 ---- */
  function dataView() {
    const cs = S.data.contents.slice().sort((a,b)=>b.date.localeCompare(a.date));
    const html = cs.map(c => {
      const saveRate = c.views? (c.saves/c.views*100).toFixed(1) : '0';
      return `<div class="item" data-content="${c.id}">
        <div class="item-ico">📱</div>
        <div class="item-main">
          <div class="item-title">${U.escapeHtml(c.title)}</div>
          <div class="item-sub">${U.fmtDateCN(c.date)} · ${U.escapeHtml(c.topic)} · ${U.escapeHtml(c.type)}</div>
          <div class="muted tiny">👁${U.num(c.views)} · ❤️${U.num(c.likes)} · ⭐${U.num(c.saves)}(${saveRate}%) · ➕${U.num(c.followersGained)}粉</div>
        </div>
        <div class="item-actions">
          <button class="icon-btn" data-edit-content="${c.id}" title="编辑">✏️</button>
          <span class="tag ${c.status==='已发布'?'content':''}">${U.escapeHtml(c.status)}</span>
        </div>
      </div>`;
    }).join('') || '<div class="card"><div class="empty"><div class="e-ico">📱</div><div class="e-sub">还没有内容记录</div></div></div>';
    return `
    <div class="tool-row" style="margin-bottom:6px"><button class="btn btn-primary" data-add-content>＋ 记录一条内容</button></div>
    <div class="card" style="padding-top:6px"><div class="list">${html}</div></div>`;
  }

  /* ---- 数据分析 ---- */
  function analysisView() {
    const cs = S.data.contents;
    if (!cs.length) return '<div class="card"><div class="empty"><div class="e-ico">📊</div><div class="e-sub">记录内容数据后才能分析</div></div></div>';
    // 按主题聚合
    const byTopic = {};
    cs.forEach(c => {
      const t = byTopic[c.topic] || (byTopic[c.topic] = { views:0, likes:0, saves:0, followers:0, n:0 });
      t.views += c.views||0; t.likes += c.likes||0; t.saves += c.saves||0; t.followers += c.followersGained||0; t.n++;
    });
    const topics = Object.entries(byTopic).map(([k,v]) => ({ k, ...v })).sort((a,b)=>b.followers-a.followers);
    const bestTopic = topics[0];
    const bestSave = topics.slice().sort((a,b)=>(b.saves/(b.views||1))-(a.saves/(a.views||1)))[0];
    const bar = Charts.bar(topics.map(t=>({label:t.k, value:t.followers, color:'var(--c-content)'})), { height:150, vfmt:v=>U.num(v) });

    const insights = [];
    insights.push(`带来涨粉最多的主题是「${bestTopic.k}」（共 +${U.num(bestTopic.followers)} 粉），可继续深耕。`);
    insights.push(`收藏率最高的主题是「${bestSave.k}」（${ (bestSave.saves/(bestSave.views||1)*100).toFixed(1) }%），说明这类内容更具「收藏价值」。`);
    const lowViews = topics.slice().sort((a,b)=>a.views-b.views)[0];
    insights.push(`「${lowViews.k}」曝光相对偏低，可优化标题或封面，再观察一轮。`);
    insights.push('建议：把表现好的主题做成系列，固定栏目化，利于算法与粉丝心智。');

    const topPost = cs.slice().sort((a,b)=>(b.followersGained||0)-(a.followersGained||0))[0];

    return `
    <div class="card">
      <div class="card-head"><h3>📊 主题涨粉对比</h3></div>
      <div class="chart-wrap">${bar}</div>
    </div>
    <div class="ai-box">
      <div class="ai-head">🤖 基于你的内容数据</div>
      <ul>${insights.map(i=>`<li>${U.escapeHtml(i)}</li>`).join('')}</ul>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-head"><h3>表现最好的一条</h3></div>
      <div class="item-title">${U.escapeHtml(topPost.title)}</div>
      <div class="muted tiny" style="margin-top:4px">${U.fmtDateCN(topPost.date)} · 涨粉 +${U.num(topPost.followersGained)} · 收藏 ${U.num(topPost.saves)}</div>
    </div>`;
  }

  function addContent(prefill, rec) {
    const isEdit = !!rec;
    const topics = ['AI','投资','职业','英语','个人成长','身体管理','产品创造','海外生活','女性成长'];
    const types = ['图文','短视频','笔记','直播'];
    const statuses = ['已发布','草稿','计划中'];
    const topicV = (rec && rec.topic) || prefill || 'AI';
    const typeV = (rec && rec.type) || '图文';
    const statusV = (rec && rec.status) || '已发布';
    App.openModal(isEdit ? '编辑内容数据' : '记录一条内容', `
      <div class="field"><label>日期</label><input id="cDate" type="date" value="${isEdit?rec.date:U.todayStr()}"></div>
      <div class="field"><label>标题</label><input id="cTitle" value="${isEdit?U.escapeHtml(rec.title):(prefill?U.escapeHtml(prefill):'')}" placeholder="内容标题"></div>
      <div class="field"><label>内容主题</label><select id="cTopic">${topics.map(t=>`<option ${topicV===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>内容类型</label><select id="cType">${types.map(t=>`<option ${typeV===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>状态</label><select id="cStatus">${statuses.map(s=>`<option ${statusV===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="mini-row">
        <div class="field"><label>曝光</label><input id="cViews" type="number" value="${isEdit?(rec.views||0):0}"></div>
        <div class="field"><label>点赞</label><input id="cLikes" type="number" value="${isEdit?(rec.likes||0):0}"></div>
      </div>
      <div class="mini-row">
        <div class="field"><label>收藏</label><input id="cSaves" type="number" value="${isEdit?(rec.saves||0):0}"></div>
        <div class="field"><label>评论</label><input id="cComments" type="number" value="${isEdit?(rec.comments||0):0}"></div>
      </div>
      <div class="mini-row">
        <div class="field"><label>分享</label><input id="cShares" type="number" value="${isEdit?(rec.shares||0):0}"></div>
        <div class="field"><label>涨粉</label><input id="cFoll" type="number" value="${isEdit?(rec.followersGained||0):0}"></div>
      </div>
      <div class="field"><label>备注</label><textarea id="cNote" placeholder="发布平台、复盘感受…">${isEdit?U.escapeHtml(rec.notes||''):''}</textarea></div>
    `, () => {
      const patch = { date:val('cDate'), title:val('cTitle')||'未命名', topic:val('cTopic'), type:val('cType'), status:val('cStatus'),
        views:parseInt(val('cViews'))||0, likes:parseInt(val('cLikes'))||0, saves:parseInt(val('cSaves'))||0,
        comments:parseInt(val('cComments'))||0, shares:parseInt(val('cShares'))||0, followersGained:parseInt(val('cFoll'))||0, notes:val('cNote') };
      if (isEdit) { S.update('contents', rec.id, patch); U.toast('已更新'); }
      else { S.add('contents', patch); U.toast('已记录内容'); }
      App.closeModal(); App.refresh();
    }, isEdit ? '更新' : '保存');
    function val(id){ return document.getElementById(id).value.trim(); }
  }

  function useIdea(i) {
    const ideas = AI.genContentIdeas(3);
    const id = ideas[i];
    addContent(id.titles[0]);
  }

  function bind() {
    const view = document.getElementById('view');
    view.querySelectorAll('[data-csub]').forEach(b => b.onclick = () => { sub = b.dataset.csub; App.refresh(); });
    view.querySelectorAll('[data-use-idea]').forEach(b => b.onclick = () => useIdea(parseInt(b.dataset.useIdea)));
    const addC = view.querySelector('[data-add-content]'); if (addC) addC.onclick = () => addContent(null);
    view.querySelectorAll('[data-content]').forEach(c => c.onclick = () => {
      const rec = S.data.contents.find(x=>x.id===c.dataset.content); if(!rec) return;
      App.openModal('内容详情', `
        <div class="item-title">${U.escapeHtml(rec.title)}</div>
        <div class="muted tiny" style="margin-top:4px">${U.fmtDateCN(rec.date)} · ${U.escapeHtml(rec.topic)} · ${U.escapeHtml(rec.type)} · ${U.escapeHtml(rec.status)}</div>
        <div class="stat-grid" style="margin-top:12px">
          <div class="stat"><div class="s-val">${U.num(rec.views)}</div><div class="s-lbl">曝光</div></div>
          <div class="stat"><div class="s-val">${U.num(rec.likes)}</div><div class="s-lbl">点赞</div></div>
          <div class="stat"><div class="s-val">${U.num(rec.saves)}</div><div class="s-lbl">收藏</div></div>
          <div class="stat"><div class="s-val">${U.num(rec.followersGained)}</div><div class="s-lbl">涨粉</div></div>
        </div>
        <div class="stat-grid" style="margin-top:8px">
          <div class="stat"><div class="s-val">${U.num(rec.comments||0)}</div><div class="s-lbl">评论</div></div>
          <div class="stat"><div class="s-val">${U.num(rec.shares||0)}</div><div class="s-lbl">分享</div></div>
        </div>
        <div class="muted tiny" style="margin-top:10px">${U.escapeHtml(rec.notes||'')}</div>
        <button class="btn btn-primary" id="modalEditContent" style="margin-top:14px;width:100%">✏️ 编辑这条内容</button>`, () => {}, '关闭');
      const me = document.getElementById('modalEditContent');
      if (me) me.onclick = () => addContent(null, rec);
    });

    // 列表上的编辑按钮（✏️）
    view.querySelectorAll('[data-edit-content]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const rec = S.data.contents.find(x=>x.id===b.dataset.editContent); if(!rec) return;
      addContent(null, rec);
    });
    App.setHeader('自媒体', '真实经历 → 我的观点 → 内容 → 数据');
  }

  return { render, bind };
})();

  function doImport(file) {
    const reader = new FileReader();

      try { S.importJSON(reader.result); App.refresh(); U.toast('导入成功'); }
      catch(e){ U.toast('导入失败：文件格式不对'); }
    };
    reader.readAsText(file);
  }

  function bind() {
    const view = document.getElementById('view');

    const ex = view.querySelector('[data-export]'); if (ex) ex.onclick = doExport;

    const imp = view.querySelector('#importFile'); if (imp) imp.onclick = (e)=>e.stopPropagation();

    const rs = view.querySelector('[data-reset]'); if (rs) rs.onclick = () => {
      if (confirm('确定清空所有数据并恢复初始示例吗？此操作不可撤销。')) { S.reset(); App.refresh(); U.toast('已重置'); }
    };
    App.setHeader('我的', '个人成长操作系统');
  }

  return { render, bind };
})();

/* 应用主控：路由 / 模态 / 主题 / 初始化 */
window.App = (function () {
  let current = 'today';

  const TABS = {
    today:  { title:'今日', icon:'🏠' },
    learn:  { title:'学习', icon:'📚' },
    wealth: { title:'财富', icon:'💰' },
    body:   { title:'身体', icon:'🏃' },
    content:{ title:'自媒体', icon:'📱' },
    profile:{ title:'我的', icon:'👤' }
  };

  function load() {
    S.load();
    applyTheme(S.data.settings.theme || 'light');
    // 底部导航
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
    // 顶部主题切换
    document.getElementById('themeToggle').onclick = () => { toggleTheme(); };
    // 首次进入生成今日主线
    AI.generateTodayPlan(false);
    // 清理遗留的「进行中」步骤（避免刷新后计时器错乱）
    cleanupDoing();
    // 深链 / 刷新保持标签
    const h = (location.hash || '').replace('#', '');
    if (TABS[h]) current = h;
    render();
    window.addEventListener('hashchange', () => {
      const hh = (location.hash || '').replace('#', '');
      if (TABS[hh] && hh !== current) { current = hh; render(); }
    });
  }

  function setHeader(title, eyebrow) {
    document.getElementById('headerTitle').textContent = title;
    if (eyebrow != null) document.getElementById('headerEyebrow').textContent = eyebrow;
  }

  function go(tab) {
    if (!TABS[tab]) return;
    current = tab;
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
    render();
  }
  function refresh() { render(); }
  function renderCurrent() { render(); }

  function cleanupDoing() {
    const t = U.todayStr();
    const plan = S.data.dailyPlans[t];
    if (!plan || !plan.tasks) return;
    let changed = false;
    plan.tasks.forEach(st => {
      if (st.status === 'doing') { st.status = 'todo'; delete st._start; changed = true; }
    });
    if (changed) S.save();
  }

  function render() {
    const main = document.getElementById('view');
    const page = window.Pages[current];
    if (!page) return;
    main.innerHTML = page.render();
    // 更新底部导航激活态
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === current));
    // 绑定
    try { page.bind(); } catch (e) { console.error('bind error', e); }
    // 滚动到顶
    main.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  /* ---------- 模态 ---------- */
  function openModal(title, bodyHtml, onSubmit, submitText) {
    const root = document.getElementById('modalRoot');
    root.classList.add('open');
    root.setAttribute('aria-hidden', 'false');
    root.innerHTML = `
      <div class="modal-mask" data-close></div>
      <div class="modal-card">
        <div class="modal-head"><h3>${U.escapeHtml(title)}</h3><button class="modal-close" data-close>×</button></div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="tool-row" style="margin-top:18px">
          <button class="btn btn-ghost" data-close>取消</button>
          <button class="btn btn-primary" id="mSubmit">${U.escapeHtml(submitText || '保存')}</button>
        </div>
      </div>`;
    root.querySelectorAll('[data-close]').forEach(el => el.onclick = closeModal);
    const sub = root.querySelector('#mSubmit');
    if (sub && onSubmit) sub.onclick = () => { try { onSubmit(); } catch(e){ console.error(e); U.toast('出错了：'+e.message); } };
    // 阻止卡片点击穿透
    root.querySelector('.modal-card').addEventListener('click', e => e.stopPropagation());
  }
  function closeModal() {
    const root = document.getElementById('modalRoot');
    root.classList.remove('open');
    root.setAttribute('aria-hidden', 'true');
    root.innerHTML = '';
  }

  /* ---------- 主题 ---------- */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeToggle').textContent = t === 'dark' ? '🌞' : '🌗';
  }
  function toggleTheme() {
    const t = (S.data.settings.theme === 'dark') ? 'light' : 'dark';
    S.data.settings.theme = t; S.save(); applyTheme(t);
    U.toast(t === 'dark' ? '已切换深色模式' : '已切换浅色模式');
  }

  return { load, go, refresh, renderCurrent, openModal, closeModal, setHeader, toggleTheme, applyTheme };
})();

    ];
    var seed = 0;
    function regen() { seed = (seed + 1) % ONE_LINERS.length; }
    function getDashboard() {
      var sugs = window.RuleEngine.getSuggestions();
      var actions = sugs.filter(function (s) { return s.category === 'action'; });
      var risks = sugs.filter(function (s) { return s.category === 'risk'; });
      var ops = sugs.filter(function (s) { return s.category === 'opportunity'; });
      var top3 = actions.slice(0, 3).map(function (s) { return s.title; });
      if (top3.length < 3) {
        top3 = top3.concat(ops.concat(risks).slice(0, 3 - top3.length).map(function (s) { return s.title; }));
      }
      function advOf(src) { var x = sugs.filter(function (s) { return s.source === src; })[0]; return x ? x.title : '保持节奏，今天没有特别要处理的。'; }
      var w = window.WealthAgent.summary();
      var s = window.StudyAgent.summary();
      var f = window.FitnessAgent.summary();
      var m = window.MediaAgent.summary();
      return {
        greeting: greeting(),
        oneLiner: ONE_LINERS[seed],
        top3: top3,
        wealth: { total: w.total, growth: w.growth, growthPct: w.growthPct, advice: advOf('WealthRule') },
        study: { recent: s.recent, advice: advOf('StudyRule') },
        body: { exercise: f.exercise, sleep: f.sleep, weight: f.weight, advice: advOf('FitnessRule') },
        media: { yesterday: m.yesterday, advice: advOf('MediaRule') },
        risk: risks.length ? risks[0].title : '暂无重大风险',
        opportunity: ops.length ? ops[0].title : '暂无特别机会'
      };
    }
    return { getDashboard: getDashboard, regen: regen };
  })();

</script>
<script>
  /* === Service Worker 注册 + 版本更新检测（新增功能，不改动业务逻辑） === */
  (function () {
    var loadedVersion = null;
    var popupShown = false;

    function fetchVersion(cb) {
      fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) { cb(d && d.version); })
        .catch(function () { cb(null); });
    }

    function showUpdate() {
      if (popupShown) return;
      popupShown = true;
      var el = document.createElement('div');
      el.className = 'update-toast';
      el.innerHTML =
        '<div class="ut-ico">✨</div>' +
        '<div class="ut-body"><div class="ut-title">发现新版本</div>' +
        '<div class="ut-sub">已发布新内容，是否立即更新？</div></div>' +
        '<div class="ut-actions"><button class="btn btn-primary btn-sm" id="utNow">立即更新</button>' +
        '<button class="btn btn-sm" id="utLater">稍后更新</button></div>';
      document.body.appendChild(el);
      el.querySelector('#utNow').onclick = function () {
        var sw = navigator.serviceWorker;
        if (sw && sw.getRegistration) {
          sw.getRegistration().then(function (reg) {
            if (reg && reg.waiting) {
              var done = false;
              reg.waiting.addEventListener('statechange', function () {
                if (this.state === 'activated' && !done) { done = true; location.reload(); }
              });
              reg.waiting.postMessage('skip');
            } else { location.reload(); }
          });
        } else { location.reload(); }
      };
      el.querySelector('#utLater').onclick = function () {
        popupShown = false;          // 允许下次再提示
        if (el.parentNode) el.parentNode.removeChild(el);
      };
    }

    function checkVersion() {
      fetchVersion(function (v) {
        if (v && loadedVersion && v !== loadedVersion) showUpdate();
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('SW 注册失败', e); });
      });
      // 新 SW 接管时再核对一次
      navigator.serviceWorker.addEventListener('controllerchange', checkVersion);
    }

    // 记录本次加载的版本
    function initVersion() { fetchVersion(function (v) { loadedVersion = v; }); }
    if (document.readyState === 'complete') initVersion();
    else window.addEventListener('load', initVersion);

    // 每分钟 + 回到前台时检查
    setInterval(checkVersion, 60000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) checkVersion();
    });
  })();
</script>
